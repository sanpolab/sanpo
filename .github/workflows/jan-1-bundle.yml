# 打鐘 -JAN-：アプリのID（io.github.sanpolab.jan）を Apple に登録する（手動、またはこのブランチへの送信で動く）
name: JAN 1 bundle
on:
  workflow_dispatch:
  push:
    branches: [jan-ios]
    paths: ["run/bundle.txt"]
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pyjwt cryptography requests
      - name: 登録
        working-directory: app-store/scripts
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: python bundle.py
