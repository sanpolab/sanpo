# iPhoneアプリを組み立てて、App Store Connect（TestFlight）に送る
# ・Appleの鍵がまだ登録されていないときは、組み立てられるかの確認だけ行う
# ・ios-release ブランチに送ると動く（手動でも動かせる）
name: iOS build

on:
  workflow_dispatch:
  push:
    branches: [ios-release]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      HAS_KEYS: ${{ secrets.ASC_KEY_P8 != '' && secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Xcode を選ぶ
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)" && xcodebuild -version

      - name: アプリの中身を用意
        run: |
          npm install --no-audit --no-fund
          npm run build
          npx cap add ios
          npx cap sync ios

      - name: アイコンと説明文を設定
        run: |
          ICONSET=ios/App/App/Assets.xcassets/AppIcon.appiconset
          for f in "$ICONSET"/*.png; do cp app-store/icon-1024.png "$f"; done
          PL=ios/App/App/Info.plist
          set_str () { /usr/libexec/PlistBuddy -c "Delete :$1" "$PL" 2>/dev/null || true; /usr/libexec/PlistBuddy -c "Add :$1 string $2" "$PL"; }
          set_str NSLocationWhenInUseUsageDescription "現在地の天気から散歩に安全な時間を判定するために使います。正確な位置は保存しません。"
          set_str NSCameraUsageDescription "うちの子の写真を撮って投稿するために使います。"
          set_str NSPhotoLibraryUsageDescription "うちの子の写真を選んで投稿するために使います。"
          set_str NSPhotoLibraryAddUsageDescription "判定のシェア画像を保存するために使います。"
          set_str CFBundleDisplayName "さんぽ路面計"
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" "$PL" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PL"

      - name: 組み立てられるか確認（シミュレーター用）
        if: env.HAS_KEYS != 'true'
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -20

      - name: Appleの鍵を準備
        if: env.HAS_KEYS == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "${{ secrets.ASC_KEY_P8 }}" > "$RUNNER_TEMP/keys/AuthKey.p8"

      - name: 本番用に組み立てる
        if: env.HAS_KEYS == 'true'
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" CODE_SIGN_STYLE=Automatic \
            PRODUCT_BUNDLE_IDENTIFIER=io.github.sanpolab.sanpo \
            MARKETING_VERSION=1.0.0 CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive | tail -30

      - name: App Store Connect に送る
        if: env.HAS_KEYS == 'true'
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" | tail -30
