# iPhoneアプリを組み立てて、App Store Connect（TestFlight）に送る
# ・Appleの鍵がまだ登録されていないときは、組み立てられるかの確認だけ行う
# ・ios-release ブランチに送ると動く（手動でも動かせる）
name: iOS build

on:
  workflow_dispatch:
  push:
    branches: [ios-release]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      HAS_KEYS: ${{ secrets.ASC_KEY_P8 != '' && secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Xcode を選ぶ
        # Appleの決まりで、最新のXcode 26以降で組み立てる必要がある
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [ -z "$X" ] && X=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$X" && xcodebuild -version

      - name: アプリの中身を用意
        run: |
          npm install --no-audit --no-fund
          npm run build
          npx cap add ios
          npx cap sync ios

      - name: プッシュ通知をつなぐ
        run: |
          python3 - <<'PY'
          import re, pathlib
          # 1) iPhoneから届いた通知用の番号を、アプリ（Capacitor）に渡す
          ad = pathlib.Path("ios/App/App/AppDelegate.swift"); s = ad.read_text()
          if "capacitorDidRegisterForRemoteNotifications" not in s:
              add = """
              func application(_ application: UIApplication, didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {
                  NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications, object: deviceToken)
              }
              func application(_ application: UIApplication, didFailToRegisterForRemoteNotificationsWithError error: Error) {
                  NotificationCenter.default.post(name: .capacitorDidFailToRegisterForRemoteNotifications, object: error)
              }
          """
              i = s.rstrip().rfind("}")
              s = s[:i] + add + "}\n"
              ad.write_text(s)
          # 2) プッシュ通知を使う許可（本番用）
          pathlib.Path("ios/App/App/App.entitlements").write_text("""<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>aps-environment</key><string>production</string></dict></plist>
          """)
          # 3) アプリ本体（App）だけに、その許可ファイルを使わせる
          pb = pathlib.Path("ios/App/App.xcodeproj/project.pbxproj"); t = pb.read_text()
          n = 0
          def fix(m):
              global n
              block = m.group(0)
              if "PRODUCT_BUNDLE_IDENTIFIER" in block and "CODE_SIGN_ENTITLEMENTS" not in block:
                  n += 1
                  return block.replace("buildSettings = {", "buildSettings = {\n\t\t\t\tCODE_SIGN_ENTITLEMENTS = App/App.entitlements;", 1)
              return block
          t = re.sub(r"buildSettings = \{.*?\n\t\t\t\};", fix, t, flags=re.S)
          pb.write_text(t); print("entitlements set in", n, "configs")
          assert n >= 2
          PY
          grep -n "RemoteNotifications" ios/App/App/AppDelegate.swift

      - name: アイコンと説明文を設定
        run: |
          ICONSET=ios/App/App/Assets.xcassets/AppIcon.appiconset
          for f in "$ICONSET"/*.png; do cp app-store/icon-1024.png "$f"; done
          PL=ios/App/App/Info.plist
          set_str () { /usr/libexec/PlistBuddy -c "Delete :$1" "$PL" 2>/dev/null || true; /usr/libexec/PlistBuddy -c "Add :$1 string $2" "$PL"; }
          set_str NSLocationWhenInUseUsageDescription "現在地の天気から散歩に安全な時間を判定し、おさんぽの記録中は歩いた道のりを記録するために使います。"
          set_str NSLocationAlwaysAndWhenInUseUsageDescription "おさんぽの記録中に、画面を閉じても歩いた道のりを記録するために使います。記録を終えると位置の取得も止まります。"
          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$PL" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PL"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string location" "$PL"
          set_str NSCameraUsageDescription "うちの子の写真を撮って投稿するために使います。"
          set_str NSPhotoLibraryUsageDescription "うちの子の写真を選んで投稿するために使います。"
          set_str NSPhotoLibraryAddUsageDescription "判定のシェア画像を保存するために使います。"
          set_str CFBundleDisplayName "にくきゅうレーダー"
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" "$PL" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PL"

      - name: 組み立てられるか確認（シミュレーター用）
        if: env.HAS_KEYS != 'true'
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -20
          test ${PIPESTATUS[0]} -eq 0

      - name: Appleの鍵を準備
        if: env.HAS_KEYS == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "${{ secrets.ASC_KEY_P8 }}" > "$RUNNER_TEMP/keys/AuthKey.p8"

      - name: 本番用に組み立てる
        if: env.HAS_KEYS == 'true'
        run: |
          # 署名なしで組み立て、通知の許可だけ仮の署名で埋め込む。送るときにAppleのクラウド署名で本番の署名に差し替える
          # （登録済みのiPhoneがなくても使える）
          set -o pipefail
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION=1.0.0 CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive | tail -30
          test -d "$RUNNER_TEMP/App.xcarchive"
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          codesign --force --sign - --entitlements ios/App/App/App.entitlements --generate-entitlement-der "$APP"
          codesign -d --entitlements :- "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" 2>/dev/null | grep -A1 aps-environment

      - name: App Store Connect に送る
        if: env.HAS_KEYS == 'true'
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" | tail -30
