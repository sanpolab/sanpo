# 打鐘 -JAN-：審査の状態を見るだけ
name: JAN 7 testflight
on:
  workflow_dispatch:
  push:
    branches: [jan-ios]
    paths: ["run/testflight.txt"]
jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pyjwt cryptography requests
      - name: 提出する
        working-directory: app-store/scripts
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          STATUS_ONLY: "1"
        run: python testflight.py
