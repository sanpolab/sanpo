# データベースの設定ファイル（supabase/*.sql）を Supabase に反映する（手動で動かす）
name: Apply SQL

on:
  workflow_dispatch:
    inputs:
      file:
        description: "反映するファイル名（例: 13_push.sql）"
        required: true

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT: odwucmmcxbdyhncxdwvg
    steps:
      - uses: actions/checkout@v4
      - name: 反映する
        env:
          FILE: ${{ inputs.file }}
        run: |
          case "$FILE" in *[!A-Za-z0-9_.-]*|"") echo "bad name"; exit 1;; esac
          test -f "supabase/$FILE"
          out=$(curl -sS -X POST "https://api.supabase.com/v1/projects/$PROJECT/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "$(jq -n --rawfile q "supabase/$FILE" '{query:$q}')")
          echo "$out"
          echo "$out" | grep -q '"message"' && exit 1 || true
