# プッシュ通知のプログラムを Supabase に入れる
# ・supabase/functions が変わったとき、または手動で動く
name: Supabase functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["supabase/functions/**", ".github/workflows/supabase.yml"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT: odwucmmcxbdyhncxdwvg
    steps:
      - uses: actions/checkout@v4
      - name: 準備ができているか確認
        id: chk
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "${{ secrets.APNS_KEY_P8 }}" ] && [ -n "${{ secrets.APNS_KEY_ID }}" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "鍵がまだ登録されていないので、今回はスキップします"; fi
      - uses: supabase/setup-cli@v1
        if: steps.chk.outputs.ok == 'true'
        with:
          version: latest
      - name: 鍵を Supabase に渡す
        if: steps.chk.outputs.ok == 'true'
        env:
          APNS_KEY_P8: ${{ secrets.APNS_KEY_P8 }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          supabase secrets set --project-ref "$PROJECT" APNS_KEY_ID="$APNS_KEY_ID" APNS_TEAM_ID="$APNS_TEAM_ID" APNS_KEY_P8="$APNS_KEY_P8"
      - name: プログラムを入れる
        if: steps.chk.outputs.ok == 'true'
        run: supabase functions deploy push --project-ref "$PROJECT" --no-verify-jwt
