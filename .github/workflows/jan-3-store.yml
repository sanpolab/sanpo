# 打鐘 -JAN-：App Store Connect にストアの情報を入力する（手動）
name: JAN 3 store
on:
  workflow_dispatch:
  push:
    branches: [jan-ios]
    paths: ["run/store.txt"]
jobs:
  asc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pyjwt cryptography requests
      - name: ストアの情報を入力
        working-directory: app-store/scripts
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          REVIEW_CONTACT_EMAIL: ${{ secrets.REVIEW_CONTACT_EMAIL }}
        run: python asc.py
