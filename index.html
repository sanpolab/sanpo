<style>
:root{
  /* 絵本風：紙の白に水彩の色。明るいテーマで統一 */
  --bg:#FAF6EC; --card:#FFFFFF; --ink:#3B3A36; --muted:#6E6A60; --line:#E7DFCC; --accent:#3F7A4A; --on-accent:#FFFFFF;
  --sun:#F6D66E; --sky:#DCEBEF;
  --ok:#5E9A4C; --caution:#C99A2E; --warn:#D9774F; --danger:#C2554A; --like:#E0707E;
  --ok-soft:#EEF4E4; --caution-soft:#FBF1D6; --warn-soft:#FBE6D8; --danger-soft:#FBE3DE;
  --display:"Klee One","Hiragino Maru Gothic ProN","Yu Gothic",serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --wob1:26px 20px 28px 22px / 20px 28px 22px 26px;
  --wob2:20px 28px 22px 26px / 28px 22px 26px 20px;
  --wob3:30px 26px 32px 24px / 26px 32px 24px 30px;
  --nav-h:66px; color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
a{color:var(--accent)}
.view{max-width:560px;margin:0 auto;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-weight:900;font-size:1.5rem;margin:0}
h2{font-family:var(--display);font-size:1.05rem;font-weight:700;margin:0}
h3{font-family:var(--display);font-size:.98rem;font-weight:700;margin:6px 0 0}
.sub,.note{font-size:.82rem;color:var(--muted);margin:0}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
section{display:flex;flex-direction:column;gap:10px}
.panel{background:var(--card);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.btn{font-weight:700;border:0;border-radius:10px;padding:10px 16px;background:var(--accent);color:var(--on-accent);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.danger{background:var(--danger);color:#fff}
.btn.wide{width:100%}
.btn:disabled{opacity:.5}
.linkbtn{border:0;background:none;color:var(--accent);padding:4px 0;cursor:pointer;text-decoration:underline;font-size:.85rem}
input[type=text],input[type=email],textarea{width:100%;font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
textarea{resize:vertical;min-height:80px}
.row2{display:flex;gap:8px;flex-wrap:wrap}.row2>*{flex:1 1 140px;min-width:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.verdict{border-radius:18px;padding:20px;background:var(--lvsoft);border:2px solid var(--lv);display:flex;flex-direction:column;gap:10px}
.when{font-size:.85rem;font-weight:700;color:var(--muted)}
.big{font-family:var(--display);font-weight:900;font-size:2.3rem;line-height:1.15;color:var(--lv);margin:0}
.lead{margin:0;font-weight:500}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.metric{background:var(--card);border-radius:12px;padding:10px 10px 8px}
.metric b{display:block;font-family:var(--display);font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.metric span{font-size:.74rem;color:var(--muted)}
.walk{flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap}
.walking b{font-family:var(--display);font-variant-numeric:tabular-nums}
.walking #walkClock{font-size:1.8rem;margin-right:8px}
.walk b{font-family:var(--display);font-size:1.8rem;font-variant-numeric:tabular-nums;margin-right:8px}
.strip{display:flex;gap:3px;overflow-x:auto;padding-bottom:4px}
.cell{flex:1 0 18px;min-width:18px;height:46px;border:0;border-radius:5px;background:var(--c);cursor:pointer;padding:0}
.cell[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:1px}
.hours{display:flex;gap:3px;font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}
.hours span{flex:1 0 18px;min-width:18px;text-align:center}
.best{background:var(--card);border-radius:12px;padding:12px 14px;font-weight:700}
.best small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.surfrow{display:grid;grid-template-columns:88px 1fr 52px;align-items:center;gap:10px}
.surfrow .v{text-align:right;font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.track{position:relative;height:12px;background:var(--bg);border-radius:6px;overflow:hidden}
.fill{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--c)}
.mark{position:absolute;top:0;bottom:0;width:2px;background:var(--danger)}
.reasons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.reasons li{background:var(--card);border-radius:12px;padding:10px 14px 10px 32px;position:relative}
.reasons li::before{content:"";position:absolute;left:13px;top:17px;width:9px;height:9px;border-radius:50%;background:var(--c)}
#homeBody{display:flex;flex-direction:column;gap:18px}
.start{background:var(--card);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px}
.start p{margin:0}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.grp{display:flex;flex-direction:column;gap:6px}.grp>span{font-size:.8rem;color:var(--muted)}
.chip{font-size:.88rem;border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:5px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}

#tab-map{max-width:none;padding:0;gap:0}
#map{position:fixed;inset:0 0 calc(var(--nav-h) + env(safe-area-inset-bottom,0px)) 0;z-index:0;background:var(--bg)}
.mapbar{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));z-index:500;display:flex;gap:8px;justify-content:space-between;pointer-events:none}
.mapbar>*{pointer-events:auto}
.pill{background:var(--card);border-radius:99px;padding:8px 14px;font-size:.85rem;font-weight:700;box-shadow:0 2px 10px rgba(0,0,0,.18);border:0;cursor:pointer}
.pill .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:-1px}
.pin{width:52px;height:52px;border-radius:14px;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35);background:#ccc center/cover no-repeat;position:relative}
.pin b{position:absolute;right:-8px;top:-8px;background:var(--accent);color:var(--on-accent);font-size:.72rem;min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}
.maplayers{position:fixed;top:calc(60px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));z-index:500;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.maplayers>*{pointer-events:auto}
.maplayers .chip{box-shadow:0 2px 8px rgba(0,0,0,.15);font-weight:700}
.maplayers .chip[data-l="lost"][aria-pressed="true"]{background:#C8553D;border-color:#C8553D;color:#fff}
.maphint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));z-index:500;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;width:max-content;max-width:calc(100% - 120px)}
.maphint>*{pointer-events:auto}
.maphint small{background:rgba(255,253,247,.95);border-radius:14px;padding:5px 12px;font-size:.8rem;box-shadow:0 2px 8px rgba(0,0,0,.15);text-align:center}
.spin{width:34px;height:34px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);display:grid;place-items:center;color:#fff;position:relative}
.spin.park{background:#3F7A4A}.spin.cafe{background:#B07A3B}
.spin svg{width:18px;height:18px}
.spin i{position:absolute;right:-12px;top:-9px;font-style:normal;background:var(--sun);color:var(--ink);font-size:.66rem;font-weight:700;border-radius:9px;padding:1px 5px;border:1.5px solid #fff;white-space:nowrap}
.lpin{width:38px;height:38px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:#C8553D;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35);display:grid;place-items:center}
.lpin.found{background:#2F6FB0}
.lpin b{transform:rotate(45deg);color:#fff;font-size:.8rem}
.stars{display:inline-flex;gap:1px;color:#E0A526}
.starpick{display:flex;gap:6px}.starpick button{font-size:1.9rem;line-height:1;border:0;background:none;color:var(--line);cursor:pointer;padding:2px}
.starpick button.on{color:#E0A526}
.rv{display:flex;gap:10px;align-items:flex-start}.rv p{margin:2px 0 0}
.lostimg{width:100%;max-height:360px;object-fit:cover;border-radius:18px;background:var(--line)}
.tag{display:inline-block;font-size:.75rem;font-weight:700;border-radius:99px;padding:2px 10px;color:#fff;background:#C8553D}.tag.found{background:#2F6FB0}.tag.done{background:var(--muted)}
input[type=datetime-local]{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:2px solid var(--line);border-radius:16px;background:#FFFDF7;color:var(--ink)}
.me-dot{width:18px;height:18px;border-radius:50%;background:#2B7BE4;border:3px solid #fff;box-shadow:0 0 0 6px rgba(43,123,228,.25)}

.seg{display:flex;background:var(--card);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 0;font-weight:700;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.feed{display:flex;flex-direction:column;gap:16px}
.post{background:var(--card);border-radius:16px;overflow:hidden}
.phead{display:flex;align-items:center;gap:10px;padding:10px 12px}
.av{width:38px;height:38px;border-radius:50%;background:var(--line) center/cover no-repeat;flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:var(--muted)}
.who{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0;cursor:pointer}
.who b{display:block;line-height:1.3}
.who span{font-size:.76rem;color:var(--muted)}
.new{display:inline-block;font-size:.66rem;font-weight:700;letter-spacing:.06em;background:var(--accent);color:var(--on-accent);border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:2px}
.more{border:0;background:none;font-size:1.3rem;line-height:1;padding:4px 8px;cursor:pointer;color:var(--muted)}
.pimg{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--line);max-width:100%}
.pbody{padding:10px 12px 14px;display:flex;flex-direction:column;gap:6px}
.acts{display:flex;gap:14px;align-items:center}
.act{border:0;background:none;display:flex;align-items:center;gap:5px;font-weight:700;padding:4px 0;cursor:pointer;font-variant-numeric:tabular-nums}
.act svg{width:24px;height:24px}
.act.liked{color:var(--like)}
.cap{margin:0;white-space:pre-wrap;word-break:break-word}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.grid3 button{border:0;padding:0;aspect-ratio:1/1;background:var(--line) center/cover no-repeat;border-radius:6px;cursor:pointer}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom,0px));z-index:600;width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);box-shadow:0 4px 14px rgba(0,0,0,.28);cursor:pointer;display:grid;place-items:center}
.fab svg{width:28px;height:28px}

.prof{display:flex;gap:14px;align-items:center}
.prof .av{width:72px;height:72px;font-size:1.6rem}
.stats{display:flex;gap:18px;font-size:.85rem;color:var(--muted);flex-wrap:wrap}
.stats b{color:var(--ink);font-family:var(--display);font-size:1.1rem;margin-right:3px}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
.list{display:flex;flex-direction:column}
.list>div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.list>div:last-child{border-bottom:0}
.legal{font-size:.88rem;line-height:1.75}
.legal p,.legal ul{margin:4px 0}
.legal ul{padding-left:1.2em}
.links{display:flex;gap:16px;flex-wrap:wrap}

nav{position:fixed;left:0;right:0;bottom:0;z-index:700;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav button{flex:1;height:var(--nav-h);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.7rem;color:var(--muted);cursor:pointer}
nav button svg{width:24px;height:24px}
nav button[aria-current="page"]{color:var(--accent);font-weight:700}

.scrim{position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheethead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{border:0;background:var(--card);width:36px;height:36px;border-radius:50%;font-size:1.2rem;cursor:pointer;flex:none}
.cmts{display:flex;flex-direction:column;gap:10px}
.cmt{display:flex;gap:10px}.cmt .av{width:30px;height:30px;font-size:.8rem}
.cmt div{min-width:0}.cmt p{margin:0;word-break:break-word}.cmt small{color:var(--muted)}
.menu{display:flex;flex-direction:column;gap:8px}
.menu button{border:0;background:var(--card);border-radius:12px;padding:14px;text-align:left;font-weight:700;cursor:pointer}
.menu .danger{color:var(--danger)}
.preview{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:14px;background:var(--line)}
.shareimg{width:100%;border-radius:14px}
.pick{border:2px dashed var(--line);border-radius:14px;aspect-ratio:1/1;display:grid;place-items:center;color:var(--muted);cursor:pointer;background:var(--card);text-align:center;padding:20px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 90px + env(safe-area-inset-bottom,0px));z-index:1000;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:.88rem;font-weight:700;max-width:90vw;text-align:center}
.leaflet-container{font-family:var(--body)}
/* ===== 絵本風の上書き ===== */
h1,h2,h3{font-weight:600}
h1{font-size:1.6rem;letter-spacing:.02em}
h2{font-size:1.2rem}
.panel,.best,.reasons li,.start,.post{border-radius:var(--wob1);box-shadow:0 2px 0 var(--line)}
.panel:nth-of-type(2n),.reasons li:nth-child(2n){border-radius:var(--wob2)}
.btn{border:2.5px solid var(--ink);border-radius:var(--wob3);background:var(--sun);color:var(--ink);min-height:48px;font-family:var(--body)}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--ink)}
.btn.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.chip{border:2px solid var(--line);border-radius:var(--wob3);padding:6px 14px}
.chip[aria-pressed="true"]{background:var(--sun);border-color:var(--ink);color:var(--ink)}
.seg{border-radius:var(--wob1)}
.seg button{border-radius:var(--wob3)}
.seg button[aria-pressed="true"]{background:var(--sun);color:var(--ink)}
input[type=text],input[type=email],textarea{font-size:16px;border:2px solid var(--line);border-radius:16px 12px 18px 14px / 12px 18px 14px 16px;background:#FFFDF7}
.fab{background:var(--sun);color:var(--ink);border:2.5px solid var(--ink)}
.new{background:var(--sun);color:var(--ink)}
nav{background:#FFFDF7;border-top:2px solid var(--line)}
nav button[aria-current="page"]{color:var(--accent)}
.toast{border-radius:var(--wob3)}
.sheet{background:var(--bg);border-radius:30px 26px 0 0}
.pill{border:2px solid var(--ink);box-shadow:none}


.bell{position:relative;border:0;background:none;padding:6px;cursor:pointer;color:var(--ink);align-self:center}
.badge{position:absolute;top:0;right:-2px;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--like);color:#fff;font-size:.72rem;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.badge.dot{min-width:10px;width:10px;height:10px;padding:0;top:10px;right:calc(50% - 18px)}
.act.liked{color:var(--like)}
.notes{display:flex;flex-direction:column;gap:8px}
.note-item{display:flex;gap:10px;align-items:center;background:var(--card);border:0;border-radius:var(--wob1);padding:10px 12px;text-align:left;cursor:pointer;width:100%}
.note-item.unread{background:#FFF7E0}
.note-item p{margin:0;font-size:.9rem;line-height:1.5;flex:1;min-width:0;word-break:break-word}
.note-item small{color:var(--muted)}
.note-item .thumb{width:44px;height:44px;border-radius:10px;background:var(--line) center/cover no-repeat;flex:none}

.official{display:inline-block;font-size:.66rem;font-weight:700;background:var(--accent);color:#fff;border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:2px;font-family:var(--body)}
.stat{text-decoration:none;color:var(--muted);font-size:.85rem;padding:0}
.msgs{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow-y:auto;padding:4px 2px}
.msg{align-self:flex-start;max-width:80%;background:var(--card);border-radius:18px 18px 18px 6px;padding:8px 12px;box-shadow:0 1px 0 var(--line)}
.msg.me{align-self:flex-end;background:#FFF1C2;border-radius:18px 18px 6px 18px}
.msg p{margin:0;white-space:pre-wrap;word-break:break-word}
.msg small{color:var(--muted);font-size:.72rem}
.seg button{font-size:.85rem}
/* 判定のシーン */
.scene{position:relative;height:300px;border-radius:34px 26px 38px 28px / 28px 36px 26px 34px;overflow:hidden;background:var(--scene-sky)}
.scene svg.bgart{position:absolute;inset:0;width:100%;height:100%}
.scene .pet{position:absolute;bottom:16px;height:auto;filter:drop-shadow(0 4px 3px rgba(59,58,54,.12))}
.scene .dog{left:8%;width:40%;max-width:170px}
.scene .cat{left:56%;width:33%;max-width:136px}
.scene .cat.shade{left:62%}
.scene .head{position:absolute;left:20px;top:18px;right:16px;display:flex;flex-direction:column;gap:2px}
.scene .head span{font-size:13px;font-weight:700;color:var(--scene-ink)}
.scene .head p{margin:0;font-family:var(--display);font-weight:600;font-size:clamp(1.9rem,9.5vw,2.4rem);line-height:1.12;color:var(--scene-ink);white-space:pre-line}
.lead{font-size:15px;line-height:1.8;margin:0 6px}
.metrics{gap:10px}
.metric{border-radius:var(--wob1);box-shadow:0 2px 0 var(--line);padding:12px 10px 10px}
.metric:nth-child(1){transform:rotate(-1.6deg)}.metric:nth-child(2){transform:rotate(1.2deg)}.metric:nth-child(3){transform:rotate(-.6deg)}
.metric b{font-family:var(--display);font-size:1.6rem;font-weight:600}
.paws{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));row-gap:4px}
.paw{border:0;background:none;padding:2px 0;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;border-radius:10px;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.paw svg{width:24px;height:24px}
.paw[aria-pressed="true"]{background:var(--ok-soft);outline:2px solid var(--ink)}
.best{background:var(--tip,var(--ok-soft));box-shadow:none}

</style>
</head>
<body>

<main class="view" id="tab-home">
  <div class="top"><h1>にくきゅうレーダー</h1><span class="sub" id="placeLbl"></span></div>
  <div id="homeBody"></div>
  <section>
    <h2>うちの子</h2>
    <div class="panel" id="petChips"></div>
  </section>
  <section>
    <h2>別の場所を調べる</h2>
    <div class="panel">
      <div class="row2"><input type="text" id="cityInput" placeholder="地名（例：横浜）" autocomplete="off"><button class="btn ghost" id="cityBtn" style="flex:0 0 auto">探す</button></div>
      <button class="btn ghost" id="geoBtn2">現在地に戻す</button>
    </div>
  </section>
  <p class="note">数値は気象データからの推定です。出かける前に手の甲を地面に5秒当てて確かめてください。息が荒い、ふらつくなどの様子があればすぐに中止し、動物病院に相談してください。天気：Open-Meteo</p>
</main>

<main class="view" id="tab-map" hidden>
  <div id="map"></div>
  <div class="mapbar">
    <button class="pill" id="mapStatus"><span class="dot" style="--c:var(--muted)"></span>現在地の判定</button>
    <button class="pill" id="mapLocate">現在地へ</button>
  </div>
  <div class="maplayers" id="mapLayers">
    <button class="chip" data-l="posts" aria-pressed="true">うちの子</button>
    <button class="chip" data-l="spots" aria-pressed="false">ドッグラン・カフェ</button>
    <button class="chip" data-l="lost" aria-pressed="false">迷子・保護</button>
  </div>
  <div class="maphint" id="mapHint"></div>

<script>
/* ================= 設定 ================= */
const CONFIG = {
  supabaseUrl: "https://odwucmmcxbdyhncxdwvg.supabase.co",
  supabaseKey: "sb_publishable_QHjteDmQ0H_2gfAv5wDAgg_LVEzWQS9",
  appUrl: "https://sanpolab.github.io/sanpo/",
  contact: "nakanakadoukana@gmail.com",      // お問い合わせ先（メールアドレスなど）
  operator: "にくきゅうレーダー 運営者",
  updated: "2026年11月1日"
};
/* ======================================= */

const READY = !!window.supabase;
const sb = READY ? supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey) : null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const photo = p => p ? `${CONFIG.supabaseUrl}/storage/v1/object/public/photos/${p}` : "";
const ls = { get(k,d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
             set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
             del(k){ try{ localStorage.removeItem(k); }catch(e){} } };
function toast(t){ const d=document.createElement("div"); d.className="toast"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2800); }
const ago = t => { const s=(Date.now()-new Date(t))/1000; if(s<60)return"たった今"; if(s<3600)return Math.floor(s/60)+"分前"; if(s<86400)return Math.floor(s/3600)+"時間前"; if(s<604800)return Math.floor(s/86400)+"日前"; const d=new Date(t); return `${d.getMonth()+1}月${d.getDate()}日`; };
const avatar = (p, name) => p ? `<span class="av" style="background-image:url('${photo(p)}')"></span>` : `<span class="av">${esc((name||"?").slice(0,1))}</span>`;
const petWord = t => t==="cat" ? "ねこ" : "わんこ";

let me = null, pos = null, weather = null, rawWeather = null;
const PET_DEFAULT = {name:"", species:"dog", size:"small", age:"adult", brachy:"no", coat:"mid", hair:"short", conds:[]};
const newPet = (o={}) => Object.assign({lid: Math.random().toString(36).slice(2)}, PET_DEFAULT, {conds:[]}, o);
let pets = ls.get("sanpo-pets", null);
if(!Array.isArray(pets) || !pets.length) pets = [newPet(ls.get("sanpo-profile", {}))];
pets = pets.map(p=>Object.assign({}, PET_DEFAULT, p, {conds: Array.isArray(p.conds)?p.conds:[]}));
let petIdx = Math.min(ls.get("sanpo-pet-idx",0), pets.length-1);
let pet = pets[petIdx];
function savePetsLocal(){ ls.set("sanpo-pets", pets); ls.set("sanpo-pet-idx", petIdx); }
let walkStart = ls.get("sanpo-walk", null);

/* ================= 判定 ================= */
const LV = [
  {name:"散歩OK", c:"var(--ok)", s:"var(--ok-soft)", hex:"#5E9A4C"},
  {name:"注意して散歩", c:"var(--caution)", s:"var(--caution-soft)", hex:"#C99A2E"},
  {name:"短めに切り上げて", c:"var(--warn)", s:"var(--warn-soft)", hex:"#D9774F"},
  {name:"今は避けて", c:"var(--danger)", s:"var(--danger-soft)", hex:"#C2554A"}
];
const CODE = c => c===0?"快晴":c<=2?"晴れ":c===3?"くもり":c<=48?"霧":c<=67?"雨":c<=77?"雪":c<=82?"にわか雨":c<=86?"にわか雪":"雷雨";
const wbgt = (t,rh,sw,ws) => 0.735*t + 0.0374*rh + 0.00292*t*rh + 7.619*sw - 4.557*sw*sw - 0.0572*ws - 4.064;
function windChill(t, ws){ const v=ws*3.6; if(t>10||v<=4.8) return t; const p=Math.pow(v,0.16); return 13.12+0.6215*t-11.37*p+0.3965*t*p; }
function evaluate(all){
  const cat = pet.species==="cat", size = cat ? "small" : pet.size;
  const cd = c => (pet.conds||[]).includes(c);
  const heatOff = (pet.brachy==="yes"?2:0) + (pet.age!=="adult"?1:0) + (size==="small"?0.5:0)
    + (pet.coat==="dark"?1:0) + (pet.hair!=="short"?1:0) + (cd("heart")||cd("breath")?1.5:0) + (cd("obese")?1:0);
  const coldOff = (size==="small"?3:size==="large"?-3:0) + (pet.age!=="adult"?2:0)
    + (pet.hair==="short"?1.5:pet.hair==="double"?-2:0) + (cd("heart")||cd("joint")?1.5:0);
  const month = new Date().getMonth()+1;
  let prevD = 0;
  return all.map((h,i)=>{
    const sw = j => all[Math.max(0,i-j)].sw;
    const lag = 0.6*sw(0)+0.25*sw(1)+0.15*sw(2);
    let d = Math.max(0.5, 0.026*lag - 0.6*Math.max(0,h.ws-1)); d = Math.max(d, prevD*0.55); prevD = d;
    const asph=h.temp+d, conc=h.temp+0.65*d, grass=h.temp+0.2*d;
    const w = wbgt(h.temp,h.rh,h.sw/1000,h.ws), wc = windChill(h.temp,h.ws);
    let p6=0, s48=0;
    for(let j=Math.max(0,i-6);j<=i;j++) p6+=all[j].precip||0;
    for(let j=Math.max(0,i-48);j<=i;j++) s48+=all[j].snow||0;
    const R=[], who = cat ? "猫" : "犬";
    if(asph>=50) R.push([3,`アスファルトが約${Math.round(asph)}℃。肉球が数十秒でやけどする温度です。`]);
    else if(asph>=45) R.push([2,`アスファルトが約${Math.round(asph)}℃。日なたの舗装路は避けて、土や芝生の上を歩きましょう。`]);
    else if(asph>=40) R.push([1,`アスファルトが約${Math.round(asph)}℃で熱め。出る前に手で触って確かめましょう。`]);
    const t1=23-heatOff,t2=26-heatOff,t3=28.5-heatOff;
    if(w>=t3) R.push([3,`暑さ指数が${w.toFixed(1)}。${who}にとって熱中症の危険が高い状態です。`]);
    else if(w>=t2) R.push([2,`暑さ指数が${w.toFixed(1)}。散歩は短く、日陰と水分補給を。`]);
    else if(w>=t1) R.push([1,`暑さ指数が${w.toFixed(1)}。地面に近い${who}は人より暑く感じています。`]);
    const c1=3+coldOff,c2=-4+coldOff,c3=-12+coldOff;
    if(wc<=c3) R.push([3,`体感温度が${Math.round(wc)}℃。体が冷えすぎる危険があります。`]);
    else if(wc<=c2) R.push([2,`体感温度が${Math.round(wc)}℃。服を着せて短めに。`]);
    else if(wc<=c1) R.push([1,`体感温度が${Math.round(wc)}℃。寒がりの子は服があると安心です。`]);
    if(h.temp<=1 && (p6>0.2||s48>0)) R.push([2,`気温${h.temp.toFixed(1)}℃で路面が凍っている可能性があります。日陰や橋の上に注意。`]);
    else if(h.temp<=-1 && h.rh>=90 && h.sw<50) R.push([1,"冷え込みで路面に霜や薄い氷ができやすい時間です。"]);
    if(s48>0 && h.temp<=6) R.push([1,"雪のあとは融雪剤がまかれていることがあります。帰ったら足をぬるま湯で洗いましょう。"]);
    if(h.precip>=10) R.push([2,`強い雨（${h.precip}mm）が予想されています。`]);
    else if(h.precip>=2) R.push([1,`雨が降っています（${h.precip}mm）。`]);
    if(h.code>=95) R.push([2,"雷の予報です。雷が苦手な子は急に走り出すことがあるので、リードをしっかり持って早めに帰りましょう。"]);
    if(h.pm25!=null){
      const sens = cd("breath")||pet.brachy==="yes"||pet.age==="senior";
      if(h.pm25>=70) R.push([2,`PM2.5が多い予報です（${Math.round(h.pm25)}µg/m³）。散歩は短めにしましょう。`]);
      else if(h.pm25>=35) R.push([sens?2:1,`PM2.5がやや多めです（${Math.round(h.pm25)}µg/m³）。${sens?"呼吸器の弱い子は短めに。":"長時間の散歩は控えめに。"}`]);
    }
    if(h.dust!=null){
      if(h.dust>=300) R.push([2,"黄砂が多く飛んでいます。目や鼻を守るため、短めにして帰ったら体をふきましょう。"]);
      else if(h.dust>=100) R.push([1,"黄砂が飛んでいます。帰ったら顔と体をやさしくふいてあげましょう。"]);
    }
    if(h.uv!=null && h.uv>=6){
      const thin = pet.coat==="light" || pet.hair==="short";
      R.push([h.uv>=8&&thin?1:0, `紫外線が強い時間です（UV指数${Math.round(h.uv)}）。${thin?"毛の色が明るい子や短毛の子は、鼻や耳が日焼けしやすいので日かげを選んで。":"日かげのコースを選びましょう。"}`]);
    }
    const level = R.reduce((m,r)=>Math.max(m,r[0]),0);
    if(!R.length) R.push([0,"暑さ、寒さ、路面ともに問題ありません。"]);
    if(h.hour<5||h.hour>=19) R.push([0,"暗い時間帯です。光るリードや反射材があると安全です。"]);
    if(cat) R.push([0,"猫は抜けにくいハーネスを使い、驚いたときにすぐ抱き上げられるようにしましょう。"]);
    if(month>=2 && month<=4 && h.hour>=8 && h.hour<=18) R.push([0,"スギ・ヒノキの花粉の季節です。目のかゆみやくしゃみが出る子は、帰ったら体をふいてあげましょう。"]);
    R.sort((a,b)=>b[0]-a[0]);
    return {level,asph,conc,grass,w,wc,reasons:R};
  });
}
async function loadWeather(lat, lon, place){
  try{
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(3)}&longitude=${lon.toFixed(3)}&hourly=temperature_2m,relative_humidity_2m,shortwave_radiation,wind_speed_10m,precipitation,snowfall,weather_code,uv_index&wind_speed_unit=ms&timezone=auto&past_days=2&forecast_days=2`);
    if(!r.ok) throw 0;
    const j = await r.json(), H = j.hourly;
    const all = H.time.map((t,i)=>({t,hour:+t.slice(11,13),temp:H.temperature_2m[i],rh:H.relative_humidity_2m[i],sw:H.shortwave_radiation[i]||0,ws:H.wind_speed_10m[i]||0,precip:H.precipitation[i]||0,snow:H.snowfall[i]||0,code:H.weather_code[i],uv:H.uv_index?H.uv_index[i]:null,pm25:null,dust:null}));
    try{
      const aq = await (await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat.toFixed(3)}&longitude=${lon.toFixed(3)}&hourly=pm2_5,dust&timezone=auto&past_days=2&forecast_days=2`)).json();
      const byT = {}; (aq.hourly?.time||[]).forEach((t,i)=>byT[t]=i);
      all.forEach(h=>{ const i=byT[h.t]; if(i!=null){ h.pm25=aq.hourly.pm2_5[i]; h.dust=aq.hourly.dust[i]; } });
    }catch(e){}
    const key = new Date(Date.now()+j.utc_offset_seconds*1000).toISOString().slice(0,13);
    let idx = all.findIndex(x=>x.t.slice(0,13)===key); if(idx<0) idx = Math.min(48, all.length-24);
    rawWeather = {all, idx, place}; weather = null;
    computeWeather();
  }catch(e){ $("#homeBody").innerHTML = startCard("天気を取得できませんでした。電波の良い場所でもう一度お試しください。"); bindStart(); }
}
function computeWeather(){
  if(!rawWeather) return;
  const {all, idx, place} = rawWeather, ev = evaluate(all);
  const sel = weather ? weather.sel : 0;
  weather = {place, sel, hours: all.slice(idx, idx+24).map((h,k)=>Object.assign({},h,ev[idx+k],{isNow:k===0}))};
  renderHome(); updateMapStatus(); scheduleMorning();
}

/* ================= 朝の通知（アプリ版だけ） ================= */
const NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
const LN = NATIVE ? (window.Capacitor.Plugins||{}).LocalNotifications : null;
async function notifPermission(){
  if(!LN) return false;
  try{ let p = await LN.checkPermissions(); if(p.display!=="granted") p = await LN.requestPermissions(); return p.display==="granted"; }catch(e){ return false; }
}
// 予報がある日は「その日のおすすめ時間」、ない日は一般的なお知らせを、7日分予約しておく
async function scheduleMorning(){
  if(!LN) return;
  try{
    const pending = await LN.getPending();
    if(pending.notifications.length) await LN.cancel({notifications: pending.notifications.map(n=>({id:n.id}))});
    const hour = ls.get("sanpo-notif","off"); if(hour==="off") return;
    const ev = rawWeather ? evaluate(rawWeather.all) : null;
    const list = [];
    for(let d=0; d<7; d++){
      const at = new Date(); at.setDate(at.getDate()+d); at.setHours(+hour,0,0,0);
      if(at <= new Date()) continue;
      let body = "今日の路面と気温をチェックして、安全な時間に散歩しましょう。";
      if(rawWeather){
        const key = `${at.getFullYear()}-${String(at.getMonth()+1).padStart(2,"0")}-${String(at.getDate()).padStart(2,"0")}`;
        const idx = rawWeather.all.map((h,i)=>[h,i]).filter(([h])=>h.t.startsWith(key)).map(([,i])=>i);
        if(idx.length===24){
          const H = idx.map(i=>Object.assign({}, rawWeather.all[i], ev[i]));
          const wins = bestWindows(H), maxA = Math.round(Math.max(...H.map(h=>h.asph)));
          body = wins.length ? `今日のおすすめは ${wins.join("、")}。アスファルトは最高で約${maxA}℃の予想です。` : `今日は安全な時間帯が少なめです（アスファルト最高約${maxA}℃）。短めの散歩か室内遊びがおすすめです。`;
        }
      }
      list.push({id:100+d, title:"今日のさんぽ判定", body, schedule:{at}});
    }
    if(list.length) await LN.schedule({notifications:list});
  }catch(e){}
}
function startCard(msg){
  return `<div class="start"><h2>いま、おさんぽして大丈夫？</h2><p>現在地の天気から、路面の温度と暑さ・寒さを判定します。位置情報はこの端末の中で使い、正確な位置はどこにも保存しません。</p>${msg?`<p class="note">${esc(msg)}</p>`:""}<button class="btn" id="geoBtn">現在地で判定する</button></div>`;
}
function bindStart(){ const b=$("#geoBtn"); if(b) b.onclick=()=>locate(true); }
function bestWindows(H){
  const runs=[]; let st=-1;
  H.forEach((x,i)=>{ const g=x.level===0&&x.hour>=5&&x.hour<21; if(g&&st<0)st=i; if((!g||i===H.length-1)&&st>=0){ runs.push([st,g?i:i-1]); st=-1; } });
  return runs.sort((a,b)=>(b[1]-b[0])-(a[1]-a[0])).slice(0,2).sort((a,b)=>a[0]-b[0]).map(([a,b])=>`${H[a].hour}時〜${(H[b].hour+1)%24}時`);
}
function walkCard(){
  if(walkStart) return `<div class="panel walk"><div><b id="walkClock">0:00</b><span class="note">おさんぽ中</span></div><div class="row2" style="flex:0 1 240px"><button class="btn" id="walkEnd">おわった</button><button class="btn ghost" id="walkCancel">取り消す</button></div></div>`;
  return `<div class="row2"><button class="btn" id="walkBtn">おさんぽスタート</button><button class="btn ghost" id="shareBtn" style="flex:0 0 auto">シェア</button></div>`;
}
/* 天気と判定から、絵本の場面を決める */
const PET_IMG = {sunny:["img/dog-sunny.png","img/cat-sunny.png"], cloudy:["img/dog-cloudy.png","img/cat-calm.png"], rain:["img/dog-rain.png","img/cat-calm.png"], snow:["img/dog-snow.png","img/cat-snow.png"], hot:["img/dog-hot.png","img/cat-hot.png"]};
function sceneOf(h){
  const c=h.code;
  if(h.asph>=45 || (h.level>=2 && h.temp>=25)) return "hot";
  if((c>=71&&c<=77)||c===85||c===86 || h.reasons.some(r=>/凍|霜|融雪/.test(r[1]))) return "snow";
  if((c>=51&&c<=67)||(c>=80&&c<=82)||c>=95||h.precip>=0.5) return "rain";
  if(c===2||c===3||c===45||c===48) return "cloudy";
  return "sunny";
}
const SCENE = {
  sunny:{sky:"#DCEBEF",hill1:"#B9D59A",hill2:"#9DC27E",ink:"#3F7A4A",tip:"#EEF4E4"},
  cloudy:{sky:"#E4E8EA",hill1:"#BCCDA6",hill2:"#A3B98D",ink:"#4E6B5A",tip:"#EEF1EC"},
  rain:{sky:"#D3DBE2",hill1:"#A9BE9A",hill2:"#90A983",ink:"#4A6378",tip:"#E6ECF1"},
  snow:{sky:"#E9EEF2",hill1:"#F6F8FA",hill2:"#E8EEF3",ink:"#3F6585",tip:"#E8EFF5"},
  hot:{sky:"#FBE8D6",hill1:"#E3C79A",hill2:"#D4AE7A",ink:"#B4473A",tip:"#FBE8D6"}
};
function sceneTitle(k,lv){
  if(k==="hot") return lv>=3?"今は\nおひるね中":lv>=2?"短めに\nしようね":"日かげを\nえらんでね";
  if(k==="snow") return "足もとに\n気をつけて";
  if(k==="rain") return lv>=1?"雨の合間に\nちょっとだけ":"小雨なら\nだいじょうぶ";
  if(lv>=3) return "今日は\nおうちで";
  if(lv>=2) return "短めに\nしようね";
  if(lv>=1) return "気をつけて\nおさんぽ";

}
function sceneArt(k){
  const S=SCENE[k];

/* ================= 散歩の記録 ================= */
// 散歩中の状態：開始時刻、通った位置、トイレ。端末に保存して、画面を閉じても続きから記録できる
let walk = ls.get("sanpo-walk2", null);
if(!walk && walkStart) walk = {start: walkStart, pts: [], toilets: []};
walkStart = walk ? walk.start : null;
let geoWatch = null;
const R_EARTH = 6371000;
function hav(a,b){ const r=x=>x*Math.PI/180, dLat=r(b[0]-a[0]), dLon=r(b[1]-a[1]); const h=Math.sin(dLat/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dLon/2)**2; return 2*R_EARTH*Math.asin(Math.sqrt(h)); }
function routeLen(pts){ let d=0; for(let i=1;i<pts.length;i++) d+=hav(pts[i-1],pts[i]); return d; }
const km = m => (m/1000).toFixed(m<10000?2:1);
function saveWalk(){ ls.set("sanpo-walk2", walk); }
function startTracking(){
  if(!navigator.geolocation || geoWatch!=null) return;
  geoWatch = navigator.geolocation.watchPosition(p=>{
    if(!walk) return;
    const c=p.coords; if(c.accuracy>40) return;
    const pt=[+c.latitude.toFixed(5), +c.longitude.toFixed(5)];
    const last=walk.pts[walk.pts.length-1];
    if(last && hav(last,pt)<8) return;
    if(walk.pts.length<3000){ walk.pts.push(pt); saveWalk(); }
    const el=$("#walkDist"); if(el) el.textContent = km(routeLen(walk.pts))+" km";
  }, ()=>{}, {enableHighAccuracy:true, maximumAge:5000, timeout:20000});
}
function stopTracking(){ if(geoWatch!=null){ navigator.geolocation.clearWatch(geoWatch); geoWatch=null; } }
if(walk) startTracking();
function walkCard(){
  if(walk){
    const pee=walk.toilets.filter(t=>t.kind==="pee").length, poo=walk.toilets.filter(t=>t.kind==="poo").length;
    return `<div class="panel walking">
      <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px"><div><b id="walkClock">0:00</b><span class="note">おさんぽ中${pet.name?"（"+esc(pet.name)+"）":""}</span></div><b id="walkDist" style="font-size:1.3rem">${km(routeLen(walk.pts))} km</b></div>
      <div class="row2"><button class="btn ghost" id="wPee">おしっこ ${pee||""}</button><button class="btn ghost" id="wPoo">うんち ${poo||""}</button></div>
      <div class="row2"><button class="btn" id="walkEnd">おわった</button><button class="btn ghost" id="walkCancel" style="flex:0 0 auto">取り消す</button></div>
      <p class="note">画面を消すと位置の記録が止まることがあります。歩いた道は自分にしか見えません。</p></div>`;
  }
  return `<div class="row2"><button class="btn" id="walkBtn">おさんぽスタート</button><button class="btn ghost" id="shareBtn" style="flex:0 0 auto">シェア</button></div>`;
}
function bindWalk(){
  const re=()=>{ $("#walkArea").innerHTML=walkCard(); bindWalk(); tick(); };
  const b=$("#walkBtn"); if(b) b.onclick=()=>{ walk={start:Date.now(), pts:[], toilets:[], petLid:pet.lid}; walkStart=walk.start; saveWalk(); ls.set("sanpo-walk",walkStart); startTracking(); re(); };
  const s=$("#shareBtn"); if(s) s.onclick=shareVerdict;
  const c=$("#walkCancel"); if(c) c.onclick=()=>{ walk=null; walkStart=null; ls.del("sanpo-walk2"); ls.del("sanpo-walk"); stopTracking(); re(); };
  const e=$("#walkEnd"); if(e) e.onclick=finishWalk;
  const pe=$("#wPee"); if(pe) pe.onclick=()=>{ walk.toilets.push({kind:"pee",at:new Date().toISOString()}); saveWalk(); re(); toast("おしっこを記録しました"); };
  const po=$("#wPoo"); if(po) po.onclick=()=>{ walk.toilets.push({kind:"poo",at:new Date().toISOString()}); saveWalk(); re(); toast("うんちを記録しました"); };
}
function tick(){ const el=$("#walkClock"); if(el&&walkStart){ const s=Math.floor((Date.now()-walkStart)/1000); el.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; } }
setInterval(tick,1000);
async function finishWalk(){
  const w = walk; if(!w) return;
  const minutes = Math.min(600, Math.max(1, Math.round((Date.now()-w.start)/60000)));
  const dist = Math.round(routeLen(w.pts));
  const h = weather ? weather.hours[0] : null;
  const wp = pets.find(p=>p.lid===w.petLid) || pet;
  walk=null; walkStart=null; ls.del("sanpo-walk2"); ls.del("sanpo-walk"); stopTracking();
  $("#walkArea").innerHTML=walkCard(); bindWalk();
  const msg = `${minutes}分${dist>=50?"・"+km(dist)+"km":""}のおさんぽでした`;
  if(!me){ toast(msg+"。ログインすると記録が残ります"); return; }
  const {data,error} = await sb.from("walks").insert({started_at:new Date(w.start).toISOString(), minutes, level:h?h.level:null, asph:h?Math.round(h.asph):null, pet_id:wp.id||null, distance_m:dist, route:w.pts.length>1?w.pts:null}).select("id").single();
  if(error) return toast("記録できませんでした");
  if(w.toilets.length) await sb.from("toilets").insert(w.toilets.map(t=>({kind:t.kind, at:t.at, pet_id:wp.id||null, walk_id:data.id})));
  toast(msg+"。記録しました");
}

/* ================= 記録（散歩・体重・トイレ） ================= */
let recTab = "walk", recPet = null;
const dstr = d => `${d.getMonth()+1}/${d.getDate()}`;
const dayKey = d => `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;

    <div class="seg" id="recSeg">${[["walk","おさんぽ"],["weight","体重"],["toilet","トイレ"]].map(([k,t])=>`<button data-r="${k}" aria-pressed="${recTab===k}">${t}</button>`).join("")}</div>

  ({walk:recWalks, weight:recWeight, toilet:recToilet})[recTab]();

async function recWalks(){
  const body=$("#recBody");
  const since=new Date(Date.now()-60*86400e3).toISOString();
  const {data} = await sb.from("walks").select("id,started_at,minutes,distance_m,route").eq("pet_id",recPet).gte("started_at",since).order("started_at",{ascending:false}).limit(200);
  const list=data||[];
  const days=new Set(list.map(w=>dayKey(new Date(w.started_at))));
  let streak=0; const c=new Date(); if(!days.has(dayKey(c))) c.setDate(c.getDate()-1);
  while(days.has(dayKey(c))){ streak++; c.setDate(c.getDate()-1); }
  const m0=new Date(); m0.setDate(1); m0.setHours(0,0,0,0);
  const month=list.filter(w=>new Date(w.started_at)>=m0);
  const mDist=month.reduce((s,w)=>s+(w.distance_m||0),0);
  body.innerHTML = `<div class="stats"><span><b>${month.length}</b>回</span><span><b>${month.reduce((s,w)=>s+w.minutes,0)}</b>分</span><span><b>${km(mDist)}</b>km</span><span><b>${streak}</b>日連続</span></div><p class="note">今月の合計</p>`
    + (list.length?`<div class="list">${list.slice(0,10).map(w=>{ const d=new Date(w.started_at); return `<div><span>${dstr(d)} ${d.getHours()}:${String(d.getMinutes()).padStart(2,"0")}</span><span>${w.distance_m?km(w.distance_m)+"km・":""}<b>${w.minutes}分</b>${w.route?` <button class="linkbtn" data-route="${w.id}">道を見る</button>`:""}</span></div>`; }).join("")}</div>`
      : `<p class="note">判定の画面の「おさんぽスタート」から記録できます。</p>`);
  body.querySelectorAll("[data-route]").forEach(b=>b.onclick=()=>{
    const w=list.find(x=>x.id===+b.dataset.route);
    const sh=openSheet(`<div class="sheethead"><h2>${dstr(new Date(w.started_at))} のおさんぽ</h2><button class="x" data-close>×</button></div><div id="routeMap" style="height:340px;border-radius:20px;overflow:hidden"></div><p class="note">${km(w.distance_m||0)} km・${w.minutes}分。この道はあなたにしか見えません。</p>`);
    setTimeout(()=>{ const m=L.map(sh.querySelector("#routeMap"),{zoomControl:false}); L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,attribution:'&copy; OpenStreetMap'}).addTo(m); const line=L.polyline(w.route,{color:"#3F7A4A",weight:5}).addTo(m); m.fitBounds(line.getBounds(),{padding:[20,20]}); },50);
  });
}
async function recWeight(){
  const body=$("#recBody");
  const {data} = await sb.from("weights").select("measured_on,kg").eq("pet_id",recPet).order("measured_on",{ascending:true}).limit(365);
  const list=(data||[]).map(r=>({d:new Date(r.measured_on+"T00:00:00"),kg:+r.kg}));
  const today=new Date(); const iso=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}-${String(today.getDate()).padStart(2,"0")}`;
  let chart="";
  if(list.length>=2){
    const pts=list.slice(-30), W=320,H=140,P=28;
    const ks=pts.map(p=>p.kg), mn=Math.min(...ks), mx=Math.max(...ks), pad=Math.max(.2,(mx-mn)*.2), lo=mn-pad, hi=mx+pad;
    const t0=+pts[0].d, t1=+pts[pts.length-1].d||t0+1;
    const X=d=>P+(W-P*1.4)*((+d-t0)/Math.max(1,t1-t0)), Y=k=>10+(H-30)*(1-(k-lo)/(hi-lo));
    const path=pts.map((p,i)=>`${i?"L":"M"}${X(p.d).toFixed(1)},${Y(p.kg).toFixed(1)}`).join(" ");
    const last=pts[pts.length-1];
    chart=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="体重の変化"><line x1="${P}" y1="${Y(mx)}" x2="${W-8}" y2="${Y(mx)}" stroke="var(--line)" stroke-dasharray="3 4"/><line x1="${P}" y1="${Y(mn)}" x2="${W-8}" y2="${Y(mn)}" stroke="var(--line)" stroke-dasharray="3 4"/>
      <text x="2" y="${Y(mx)+4}" font-size="10" fill="var(--muted)">${mx}</text><text x="2" y="${Y(mn)+4}" font-size="10" fill="var(--muted)">${mn}</text>
      <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${pts.map(p=>`<circle cx="${X(p.d)}" cy="${Y(p.kg)}" r="2.5" fill="var(--accent)"/>`).join("")}
      <circle cx="${X(last.d)}" cy="${Y(last.kg)}" r="5" fill="var(--sun)" stroke="var(--ink)" stroke-width="1.5"/>
      <text x="${P}" y="${H-4}" font-size="10" fill="var(--muted)">${dstr(pts[0].d)}</text><text x="${W-8}" y="${H-4}" font-size="10" fill="var(--muted)" text-anchor="end">${dstr(last.d)}</text></svg>`;
  }
  body.innerHTML = `<div class="row2"><input type="text" id="kgIn" inputmode="decimal" placeholder="体重（kg）例：8.4"><button class="btn" id="kgBtn" style="flex:0 0 auto">記録する</button></div><p class="note">1日1回まで。同じ日に記録すると上書きされます。</p>`
    + (list.length?`${chart}<div class="list">${list.slice(-5).reverse().map(r=>`<div><span>${dstr(r.d)}</span><b>${r.kg} kg</b></div>`).join("")}</div>`:`<p class="note">まだ記録がありません。</p>`);
  $("#kgBtn").onclick=async()=>{
    const v=parseFloat($("#kgIn").value.replace(/[^0-9.]/g,""));
    if(!(v>0&&v<150)) return toast("体重を数字で入れてください");
    const {error}=await sb.from("weights").upsert({pet_id:recPet, measured_on:iso, kg:Math.round(v*100)/100},{onConflict:"pet_id,measured_on"});
    if(error) return toast("記録できませんでした"); toast("記録しました"); recWeight();
  };
}

  const [dogI, catI] = await Promise.all(PET_IMG[k].map(load));

  rr(48,48,984,700,80); x.save(); x.clip(); x.fillStyle=S.sky; x.fillRect(48,48,984,700);

  const blob = await new Promise(r=>c.toBlob(r,"image/png"));
  const file = new File([blob],"sanpo.png",{type:"image/png"});

function getPosition(){

    if(!navigator.geolocation) return rej(new Error("unsupported"));
    navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lon:p.coords.longitude}), rej, {timeout:12000,maximumAge:300000,enableHighAccuracy:false});

}

const spotCache = {}; let spotReq = 0;
const starStr = n => "★".repeat(Math.round(n)) + "☆".repeat(5-Math.round(n));
async function loadSpots(){
  if(!map) return;
  if(!layers.spots || map.getZoom()<13){ spotLayer.clearLayers(); return; }
  const b=map.getBounds(), r=v=>Math.round(v*50)/50; // 約2km単位でまとめて読み込む（同じ所を何度も聞かない）
  const s=r(b.getSouth())-0.02, w=r(b.getWest())-0.02, n=r(b.getNorth())+0.02, e=r(b.getEast())+0.02;
  const key=[s,w,n,e].map(v=>v.toFixed(2)).join(",");
  const my=++spotReq;
  let spots=spotCache[key];
  if(!spots){
    const q=`[out:json][timeout:20];(nwr["leisure"="dog_park"](${key});nwr["amenity"~"^(cafe|restaurant)$"]["dog"~"^(yes|leashed|outside)$"](${key}););out center 200;`;
    try{
      const res=await fetch("https://overpass-api.de/api/interpreter",{method:"POST",body:"data="+encodeURIComponent(q),headers:{"Content-Type":"application/x-www-form-urlencoded"}});
      const j=await res.json();
      spots=(j.elements||[]).map(x=>({
        id:`${x.type}/${x.id}`, lat:x.lat??x.center?.lat, lon:x.lon??x.center?.lon,
        type:x.tags?.leisure==="dog_park"?"dogpark":"cafe",
        name:(x.tags?.["name:ja"]||x.tags?.name||(x.tags?.leisure==="dog_park"?"ドッグラン":"ペット可のお店")).slice(0,80),
        dog:x.tags?.dog||"", hours:x.tags?.opening_hours||""
      })).filter(x=>x.lat!=null);
      spotCache[key]=spots;
    }catch(err){ if(my===spotReq) toast("お店の情報を読み込めませんでした"); return; }
  }
  if(my!==spotReq || !layers.spots) return;
  const stats={};
  if(READY && spots.length){
    const {data}=await sb.from("spot_reviews").select("osm_id,stars").in("osm_id",spots.map(x=>x.id).slice(0,200));
    (data||[]).forEach(r=>{ const t=stats[r.osm_id]=stats[r.osm_id]||{n:0,sum:0}; t.n++; t.sum+=r.stars; });
  }
  if(my!==spotReq) return;
  spotLayer.clearLayers();
  spots.forEach(x=>{
    const st=stats[x.id];
    const icon=L.divIcon({className:"",html:`<div class="spin ${x.type==="dogpark"?"park":"cafe"}">${x.type==="dogpark"?ICON_PARK:ICON_CAFE}${st?`<i>★${(st.sum/st.n).toFixed(1)}</i>`:""}</div>`,iconSize:[34,34],iconAnchor:[17,17]});
    L.marker([x.lat,x.lon],{icon}).addTo(spotLayer).on("click",()=>openSpot(x));
  });
}

/* ================= 投稿 ================= */
const POST_COLS = "id,user_id,image_path,caption,area_name,lat_grid,lon_grid,created_at,profiles!posts_user_id_fkey(nickname,dog_name,dog_breed,avatar_path,pet_type,is_private,is_official,handle),likes!likes_post_id_fkey(count),comments!comments_post_id_fkey(count)";
let likedSet = new Set(), postCache = {};
async function fetchPosts(filter, limit=30){
  if(!READY) return [];
  let q = sb.from("posts").select(POST_COLS).order("created_at",{ascending:false}).limit(limit);
  q = filter ? filter(q) : q;
  const {data,error} = await q;
  if(error){ console.error(error); toast("投稿を読み込めませんでした（"+(error.message||error.code||"")+"）"); return []; }
  const posts = data||[];
  posts.forEach(p=>{ p.likeCount=p.likes?.[0]?.count||0; p.cmtCount=p.comments?.[0]?.count||0; postCache[p.id]=p; });
  if(me && posts.length){
    const {data:l} = await sb.from("likes").select("post_id").eq("user_id",me.id).in("post_id",posts.map(p=>p.id));
    (l||[]).forEach(x=>likedSet.add(x.post_id));
  }
  return posts;
}
const heart = f => `<svg viewBox="0 0 24 24" aria-hidden="true"><g fill="${f?"currentColor":"none"}" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="15.3" rx="5.4" ry="4.6"/><ellipse cx="5.6" cy="10" rx="2" ry="2.5"/><ellipse cx="9.6" cy="6" rx="2" ry="2.5"/><ellipse cx="14.4" cy="6" rx="2" ry="2.5"/><ellipse cx="18.4" cy="10" rx="2" ry="2.5"/></g></svg>`;
const bubble = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>`;
function postCard(p){
  const pr=p.profiles||{}, liked=likedSet.has(p.id), fresh = Date.now()-new Date(p.created_at) < 24*HOUR;
  const who = esc(pr.dog_name||pr.nickname||"飼い主さん") + (pr.is_official?OFFICIAL:"") + (pr.is_private?LOCK:"");
  return `<article class="post" data-id="${p.id}">
    <div class="phead">${avatar(pr.avatar_path, pr.dog_name||pr.nickname)}
      <button class="who" data-act="user" data-uid="${p.user_id}"><b>${who}${fresh?'<span class="new">NEW</span>':""}</b><span>${pr.dog_breed?esc(pr.dog_breed)+" ・ ":""}${esc(pr.nickname||"")} ・ ${p.area_name?esc(p.area_name)+"あたり ・ ":""}${ago(p.created_at)}</span></button>
      <button class="more" data-act="menu" aria-label="メニュー">⋯</button></div>
    <img class="pimg" src="${photo(p.image_path)}" alt="${esc(pr.dog_name||petWord(pr.pet_type))}の写真" loading="lazy">
    <div class="pbody"><div class="acts">
      <button class="act ${liked?"liked":""}" data-act="like" aria-pressed="${liked}" aria-label="肉球（いいね）">${heart(liked)}<span>${p.likeCount}</span></button>
      <button class="act" data-act="comments">${bubble}<span>${p.cmtCount}</span></button></div>
      ${p.caption?`<p class="cap">${esc(p.caption)}</p>`:""}</div></article>`;
}
document.addEventListener("click", async e=>{
  const lg = e.target.closest("[data-legal]"); if(lg) return openLegal(lg.dataset.legal);
  const b = e.target.closest("[data-act]"); if(!b) return;
  const card = b.closest(".post"), id = card ? +card.dataset.id : null, p = postCache[id];
  const act = b.dataset.act;
  if(act==="user") return openUser(b.dataset.uid);
  if(act==="comments") return openComments(id);
  if(act==="menu") return openPostMenu(p);
  if(act==="like"){
    if(!me) return needLogin();

    const {error} = liked ? await sb.from("likes").delete().eq("post_id",id).eq("user_id",me.id) : await sb.from("likes").insert({post_id:id});
    if(error) return toast("うまくいきませんでした");

    document.querySelectorAll(`.post[data-id="${id}"] [data-act="like"]`).forEach(x=>{ x.classList.toggle("liked",!liked); x.setAttribute("aria-pressed",!liked); x.innerHTML=`${heart(!liked)}<span>${p.likeCount}</span>`; });

let feedMode = "new";
$("#feedSeg").onclick = e=>{ const b=e.target.closest("button"); if(!b) return; feedMode=b.dataset.f; $("#feedSeg").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b)); loadFeed(); };
async function loadFeed(){
  const el=$("#feed");
  if(!READY){ el.innerHTML=`<div class="empty">投稿を読み込めませんでした。電波の良い場所で開き直してください。</div>`; return; }
  el.innerHTML=`<div class="empty">読み込み中…</div>`;
  if(feedMode==="buddy") return loadBuddies();
  let posts=[];
  if(feedMode==="new") posts = await fetchPosts();
  else if(feedMode==="near"){
    if(!pos){ try{ pos=await getPosition(); }catch(e){} }
    if(!pos){ el.innerHTML=`<div class="empty">位置情報をオンにすると、近くのうちの子が見られます。</div>`; return; }
    posts = await fetchPosts(q=>q.lt("created_at",new Date(Date.now()-HOUR).toISOString()).gte("lat_grid",pos.lat-0.08).lte("lat_grid",pos.lat+0.08).gte("lon_grid",pos.lon-0.1).lte("lon_grid",pos.lon+0.1));
    posts = posts.filter(p=>!p.profiles?.is_private);
  } else {
    if(!me){ el.innerHTML=`<div class="empty">ログインすると、フォローした子の投稿が見られます。</div>`; return; }
    const {data:f} = await sb.from("follows").select("followee_id").eq("follower_id",me.id).eq("status","accepted");
    const ids=(f||[]).map(x=>x.followee_id);
    if(!ids.length){ el.innerHTML=`<div class="empty">まだ誰もフォローしていません。気になる子のお名前をタップしてフォローしてみましょう。</div>`; return; }
    posts = await fetchPosts(q=>q.in("user_id",ids));
  }
  el.innerHTML = posts.length ? posts.map(postCard).join("") : `<div class="empty">${feedMode==="near"?"近くの投稿はまだありません。最初の1枚を投稿してみませんか？":"まだ投稿がありません。"}</div>`;
}

function openSheet(html){
  closeSheet();
  const s=document.createElement("div"); s.className="scrim"; s.id="scrim";
  s.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  s.addEventListener("click",e=>{ if(e.target===s||e.target.closest("[data-close]")) closeSheet(); });
  document.body.appendChild(s); document.body.style.overflow="hidden";
  return s.querySelector(".sheet");
}
function closeSheet(){ const s=$("#scrim"); if(s) s.remove(); document.body.style.overflow=""; }

/* ================= 投稿する ================= */
async function shrink(file, max=1280){
  let src;
  try{ src = await createImageBitmap(file,{imageOrientation:"from-image"}); }
  catch(e){ src = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); }); }
  const s = Math.min(1, max/Math.max(src.width,src.height));
  const c = document.createElement("canvas"); c.width=Math.round(src.width*s); c.height=Math.round(src.height*s);
  c.getContext("2d").drawImage(src,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(r,"image/jpeg",0.85)); // 描き直すので撮影場所などの情報は消える
}
async function areaName(lat, lon, zoom){
  try{
    const j = await (await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=${zoom}&accept-language=ja`)).json();
    const a = j.address||{}, city = a.city||a.town||a.village||a.county||"", sub = zoom>=14 ? (a.city_district||a.suburb||a.quarter||"") : "";
    return ((city + (sub && !city.includes(sub) ? sub : "")) || a.state || "").slice(0,60);
  }catch(e){ return ""; }
}
// 近くで投稿している人が少ないときは、もっと広いエリアにぼかす
async function safeArea(lat, lon){
  const fine = v => Math.round(v*100)/100, wide = v => Math.round(v*20)/20;
  const la=fine(lat), lo=fine(lon);
  const {data} = await sb.from("posts").select("user_id").eq("lat_grid",la).eq("lon_grid",lo)
    .gte("created_at",new Date(Date.now()-60*86400e3).toISOString()).limit(200);
  const others = new Set((data||[]).map(r=>r.user_id).filter(u=>u!==me.id)).size;
  if(others >= 2) return {lat_grid:la, lon_grid:lo, area_name: await areaName(la,lo,14), wide:false};
  const wa=wide(lat), wo=wide(lon);
  return {lat_grid:wa, lon_grid:wo, area_name: await areaName(wa,wo,10), wide:true};
}

    <p class="note">家や表札、人の顔、車のナンバーが写っていないか確認してください。写真の撮影場所の情報は自動で消してから送ります。投稿すると<button class="linkbtn" data-legal="terms">利用規約</button>に同意したものとみなします。</p>

  const sh = openSheet(`<h2>アカウントを削除しますか？</h2><p>投稿した写真、コメント、いいね、フォロー、散歩の記録がすべて消え、元に戻せません。</p><label class="check"><input type="checkbox" id="delOk"><span>すべて消えることを理解しました</span></label><div class="menu"><button class="danger" id="delYes" disabled>アカウントを削除する</button><button data-close>やめる</button></div>`);
  const yes = sh.querySelector("#delYes");
  sh.querySelector("#delOk").onchange = e=>{ yes.disabled = !e.target.checked; };
  yes.onclick = async()=>{
    yes.disabled = true; yes.textContent = "削除しています…";
    try{
      const {data:files} = await sb.storage.from("photos").list(me.id,{limit:1000});
      if(files && files.length) await sb.storage.from("photos").remove(files.map(f=>`${me.id}/${f.name}`));
    }catch(e){}
    const {error} = await sb.rpc("delete_account");
    if(error){ yes.disabled=false; yes.textContent="アカウントを削除する"; return toast("削除できませんでした。時間をおいてお試しください"); }
    await sb.auth.signOut(); closeSheet(); me=null; renderMe(); toast("アカウントを削除しました");
  };
}

let chatTimer = null;
const pair = (a,b) => a<b ? [a,b] : [b,a];
async function openChatWith(uid){
  if(!me) return needLogin();
  if(uid===me.id) return;
  const [a,b] = pair(me.id, uid);
  let {data:c} = await sb.from("chats").select("*").eq("user_a",a).eq("user_b",b).maybeSingle();
  if(!c){
    const r = await sb.from("chats").insert({user_a:a,user_b:b}).select("*").single();
    if(r.error) return toast("メッセージを始められませんでした");
    c = r.data;
  }
  openChat(c.id);
}
async function openChats(){
  if(!me) return needLogin();
  const sh = openSheet(`<div class="sheethead"><h2>メッセージ</h2><button class="x" data-close>×</button></div><div id="chatList"><p class="note">読み込み中…</p></div>`);
  const {data:cs} = await sb.from("chats").select("*").order("last_at",{ascending:false}).limit(50);
  const list = cs||[], el = sh.querySelector("#chatList");
  if(!list.length){ el.innerHTML=`<p class="note">まだメッセージはありません。プロフィールの「メッセージ」から送れます。</p>`; return; }
  const others = list.map(c=>c.user_a===me.id?c.user_b:c.user_a);
  const [{data:ps},{data:unr}] = await Promise.all([
    sb.from("profiles").select("id,nickname,dog_name,avatar_path,is_official").in("id",others),
    sb.from("messages").select("chat_id").is("read_at",null).neq("sender_id",me.id).in("chat_id",list.map(c=>c.id))
  ]);
  const pm={}; (ps||[]).forEach(p=>pm[p.id]=p);
  const un={}; (unr||[]).forEach(m=>un[m.chat_id]=(un[m.chat_id]||0)+1);
  el.innerHTML = `<div class="notes">${list.map(c=>{ const o=pm[c.user_a===me.id?c.user_b:c.user_a]||{}; const req=c.status==="pending"; return `<button class="note-item ${un[c.id]?"unread":""}" data-chat="${c.id}">${avatar(o.avatar_path,o.dog_name||o.nickname)}<p><b>${esc(o.dog_name||o.nickname||"ユーザー")}</b>${o.is_official?OFFICIAL:""}${req?` <span class="new">${c.requested_by===me.id?"承認待ち":"リクエスト"}</span>`:""}<br><small>${ago(c.last_at)}${un[c.id]?` ・ 未読 ${un[c.id]}`:""}</small></p></button>`; }).join("")}</div>`;
  el.querySelectorAll("[data-chat]").forEach(b=>b.onclick=()=>openChat(+b.dataset.chat));
}
async function openChat(cid){
  clearInterval(chatTimer);
  const sh = openSheet(`<div class="sheethead"><button class="linkbtn" id="chatBack">← 一覧</button><b id="chatName"></b><button class="x" data-close>×</button></div><div id="chatTop"></div><div class="msgs" id="msgs"><p class="note">読み込み中…</p></div><div id="chatForm"></div>`);
  sh.querySelector("#chatBack").onclick=()=>{ clearInterval(chatTimer); openChats(); };
  const {data:c} = await sb.from("chats").select("*").eq("id",cid).single();
  if(!c){ sh.querySelector("#msgs").innerHTML=`<p class="note">見つかりませんでした。</p>`; return; }
  const oid = c.user_a===me.id?c.user_b:c.user_a;
  const {data:o} = await sb.from("profiles").select("id,nickname,dog_name,avatar_path").eq("id",oid).single();
  const oname = o?.dog_name||o?.nickname||"ユーザー";
  sh.querySelector("#chatName").textContent = oname;
  let last = "";
  const draw = async()=>{
    if(!document.body.contains(sh)){ clearInterval(chatTimer); return; }
    const [{data:cc},{data:ms}] = await Promise.all([sb.from("chats").select("status,requested_by").eq("id",cid).single(), sb.from("messages").select("id,sender_id,body,created_at,read_at").eq("chat_id",cid).order("created_at").limit(300)]);
    const list = ms||[], st = cc?cc.status:"pending", mineReq = cc&&cc.requested_by===me.id;
    const sig = st+list.length+(list.at(-1)?.read_at||"");
    if(sig!==last){
      last = sig;
      const box = sh.querySelector("#msgs");
      box.innerHTML = list.length ? list.map(m=>`<div class="msg ${m.sender_id===me.id?"me":""}"><p>${esc(m.body)}</p><small>${ago(m.created_at)}${m.sender_id===me.id&&m.read_at?" ・ 既読":""}</small></div>`).join("") : `<p class="note">最初のメッセージを送ってみましょう。会うときは、公園など人のいる場所にしてくださいね。</p>`;
      box.scrollTop = box.scrollHeight;
      const top = sh.querySelector("#chatTop");
      top.innerHTML = st==="pending" ? (mineReq
        ? `<p class="note">メッセージリクエストを送りました。相手が承認するまで、次のメッセージは送れません。</p>`
        : `<div class="panel"><p style="margin:0"><b>${esc(oname)}</b> からのメッセージリクエストです。</p><div class="row2"><button class="btn" id="cAcc">承認する</button><button class="btn ghost" id="cDel">削除</button></div><div style="display:flex;gap:16px"><button class="linkbtn" id="cBlk">ブロック</button><button class="linkbtn" id="cRep">通報</button></div></div>`) : "";
      const acc=sh.querySelector("#cAcc"); if(acc) acc.onclick=async()=>{ await sb.from("chats").update({status:"accepted"}).eq("id",cid); last=""; draw(); };
      const del=sh.querySelector("#cDel"); if(del) del.onclick=async()=>{ await sb.from("chats").delete().eq("id",cid); toast("削除しました"); openChats(); };
      const blk=sh.querySelector("#cBlk"); if(blk) blk.onclick=()=>confirmBlock(oid, oname);
      const rp=sh.querySelector("#cRep"); if(rp) rp.onclick=()=>reportUser(oid, oname);
      const canSend = st==="accepted" || (mineReq && !list.length);
      sh.querySelector("#chatForm").innerHTML = canSend ? `<div class="row2"><input type="text" id="msgIn" maxlength="500" placeholder="メッセージ"><button class="btn" id="msgBtn" style="flex:0 0 auto">送る</button></div>` : "";
      const mb=sh.querySelector("#msgBtn"), mi=sh.querySelector("#msgIn");
      if(mb){ const send=async()=>{ const v=mi.value.trim(); if(!v) return; mb.disabled=true; const {error}=await sb.from("messages").insert({chat_id:cid,body:v}); mb.disabled=false; if(error) return toast("送れませんでした"); mi.value=""; last=""; draw(); }; mb.onclick=send; mi.onkeydown=e=>{ if(e.key==="Enter"&&!e.isComposing) send(); }; }
    }
    const unreadIds = list.filter(m=>m.sender_id!==me.id && !m.read_at).map(m=>m.id);
    if(unreadIds.length){ await sb.from("messages").update({read_at:new Date().toISOString()}).in("id",unreadIds); await sb.from("notifications").update({read:true}).eq("user_id",me.id).eq("actor_id",oid).eq("kind","message"); refreshUnread(); }
  };
  await draw();
  chatTimer = setInterval(draw, 8000);
}

      <div class="row2"><button class="btn" id="bdEdit">${mine?"登録を変える":"仲間さがしに登録する"}</button>${mine?`<button class="btn ghost" id="bdOff" style="flex:0 0 auto">やめる</button>`:""}</div></div>
    ${pos?(list.length?list.map(b=>`<div class="post"><div class="phead">${avatar(b.p?.avatar_path,b.p?.dog_name||b.p?.nickname)}<button class="who" data-act="user" data-uid="${b.user_id}"><b>${esc(b.p?.dog_name||b.p?.nickname||"飼い主さん")}${b.p?.is_official?OFFICIAL:""}</b><span>${b.p?.dog_breed?esc(b.p.dog_breed)+" ・ ":""}${esc(b.area_name||"このあたり")} ・ ${b.times.map(tl).join("・")||"時間帯いろいろ"}</span></button></div><div class="pbody">${b.note?`<p class="cap">${esc(b.note)}</p>`:""}<button class="btn ghost" data-dm="${b.user_id}">メッセージを送る</button></div></div>`).join("")
      :`<div class="empty">近くに登録している人はまだいません。先に登録して待ってみましょう。</div>`)
     :`<div class="empty">位置情報をオンにすると、近くの散歩仲間が表示されます。</div>`}`;
  el.querySelectorAll("[data-dm]").forEach(b=>b.onclick=()=>openChatWith(b.dataset.dm));
  $("#bdEdit").onclick=()=>editBuddy(mine);
  const off=$("#bdOff"); if(off) off.onclick=async()=>{ await sb.from("buddies").delete().eq("user_id",me.id); toast("登録をやめました"); loadBuddies(); };
}
function editBuddy(mine){
  let times = mine ? [...mine.times] : [];
  const sh = openSheet(`<div class="sheethead"><h2>散歩仲間の登録</h2><button class="x" data-close>×</button></div>
    <div class="grp"><span>よく散歩する時間帯</span><div class="chips" id="bdTimes">${TIMES.map(([v,t])=>`<button class="chip" data-t="${v}" aria-pressed="${times.includes(v)}">${t}</button>`).join("")}</div></div>
    <textarea id="bdNote" maxlength="120" placeholder="ひとこと（例：小型犬の友だちを探しています。朝7時ごろ、近くの公園を歩いています）">${esc(mine?mine.note:"")}</textarea>
    <p class="note">場所は約5km単位の地域名だけが表示されます。会うときは、人の多い公園などにしましょう。</p>
    <button class="btn wide" id="bdSave">登録する</button>`);
  sh.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{ const v=b.dataset.t; times=times.includes(v)?times.filter(x=>x!==v):[...times,v]; b.setAttribute("aria-pressed",times.includes(v)); });
  sh.querySelector("#bdSave").onclick=async()=>{
    try{ if(!pos) pos=await getPosition(); }catch(e){ return toast("位置情報を使えないため登録できません"); }
    const la=Math.round(pos.lat*20)/20, lo=Math.round(pos.lon*20)/20;
    const area = await areaName(la,lo,10);
    const {error}=await sb.from("buddies").upsert({user_id:me.id, area_name:area, lat_grid:la, lon_grid:lo, times, note:sh.querySelector("#bdNote").value.trim(), updated_at:new Date().toISOString()});
    if(error) return toast("登録できませんでした");
    closeSheet(); toast("登録しました"); loadBuddies();
  };
}

/* ================= お知らせ ================= */
let unread = 0;
async function refreshUnread(){
  if(!me){ unread=0; dmUnread=0; paintBadges(); return; }
  const [{count},{count:dmc}] = await Promise.all([
    sb.from("notifications").select("id",{count:"exact",head:true}).eq("user_id",me.id).eq("read",false).neq("kind","message"),
    sb.from("messages").select("id",{count:"exact",head:true}).is("read_at",null).neq("sender_id",me.id)
  ]);
  unread = count||0; dmUnread = dmc||0; paintBadges();
}
let dmUnread = 0;
function paintBadges(){
  const b=$("#bellBadge"), n=$("#navBadge"), d=$("#dmBadge");
  if(b){ b.hidden = !unread; b.textContent = unread>99?"99+":unread; }
  if(d){ d.hidden = !dmUnread; d.textContent = dmUnread>99?"99+":dmUnread; }
  if(n) n.hidden = !(unread||dmUnread);
}
setInterval(()=>{ if(me && document.visibilityState==="visible") refreshUnread(); }, 60000);
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && me) refreshUnread(); });
function noteText(n){
  const who = `<b>${esc(n.actor?.dog_name||n.actor?.nickname||"だれか")}</b>`;
  return ({
    like: `${who} があなたの投稿に肉球を押しました`,
    comment: `${who} がコメントしました：「${esc((n.comments?.body||"").slice(0,40))}」`,
    follow: `${who} にフォローされました`,
    follow_request: `${who} からフォローリクエストが届きました`,
    follow_accept: `${who} がフォローを承認しました`
  })[n.kind] || "";
}
async function openNotes(){
  if(!me) return needLogin();
  const sh = openSheet(`<div class="sheethead"><h2>お知らせ</h2><button class="x" data-close>×</button></div><div class="notes" id="notes"><p class="note">読み込み中…</p></div>`);
  const {data,error} = await sb.from("notifications")
    .select("id,kind,read,created_at,post_id,actor_id,actor:profiles!notifications_actor_id_fkey(nickname,dog_name,avatar_path),posts!notifications_post_id_fkey(image_path),comments!notifications_comment_id_fkey(body)")
    .eq("user_id",me.id).neq("kind","message").order("created_at",{ascending:false}).limit(60);
  const el = sh.querySelector("#notes");
  if(error){ el.innerHTML=`<p class="note">お知らせを読み込めませんでした。</p>`; return; }
  if(!data.length){ el.innerHTML=`<p class="note">まだお知らせはありません。投稿に肉球やコメントがつくと、ここに届きます。</p>`; return; }
  el.innerHTML = data.map(n=>`<button class="note-item ${n.read?"":"unread"}" data-n="${n.id}">${avatar(n.actor?.avatar_path, n.actor?.dog_name||n.actor?.nickname)}<p>${noteText(n)}<br><small>${ago(n.created_at)}</small></p>${n.posts?.image_path?`<span class="thumb" style="background-image:url('${photo(n.posts.image_path)}')"></span>`:""}</button>`).join("");
  el.querySelectorAll("[data-n]").forEach(b=>b.onclick=async()=>{
    const n = data.find(x=>x.id===+b.dataset.n);
    if(n.kind==="follow_request"){ closeSheet(); go("me"); return; }
    if(n.post_id){ const ps = await fetchPosts(q=>q.eq("id",n.post_id)); if(ps[0]) openSheet(`<div class="sheethead"><span></span><button class="x" data-close>×</button></div>${postCard(ps[0])}`); else toast("この投稿は見られなくなりました"); return; }
    openUser(n.actor_id);
  });
  if(data.some(n=>!n.read)){ await sb.from("notifications").update({read:true}).eq("user_id",me.id).eq("read",false).neq("kind","message"); unread=0; paintBadges(); }
}
$("#bellBtn").onclick = openNotes;
$("#searchBtn").onclick = openSearch;

/* ================= 画面切り替え ================= */
function go(tab){
  ["home","map","feed","me"].forEach(t=>$("#tab-"+t).hidden = t!==tab);
  document.querySelectorAll("nav button").forEach(b=> b.dataset.tab===tab ? b.setAttribute("aria-current","page") : b.removeAttribute("aria-current"));
  $("#fab").hidden = !(READY && (tab==="feed"||tab==="map"));
  if(tab==="map") setTimeout(initMap,0);
  if(tab==="feed") loadFeed();
  if(tab==="me") renderMe();
  window.scrollTo(0,0);
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.tab));

/* ================= 起動 ================= */
renderHome(); renderMe();
if(ls.get("sanpo-geo-ok",false)) locate(false);
// ストアに載せるページ用：#privacy #terms #support で直接開ける
function openFromHash(){
  const h = location.hash.slice(1);
  if(h==="privacy"||h==="terms") openLegal(h);
  else if(h==="support") openSheet(`<div class="sheethead"><h2>サポート</h2><button class="x" data-close>×</button></div><div class="legal"><p>「にくきゅうレーダー」についてのご質問、不具合のご報告、投稿の削除依頼は、次のメールアドレスまでご連絡ください。</p><p><b>${esc(CONFIG.contact)}</b></p><p>アカウントの削除は、アプリのマイページにある「アカウントを削除する」からいつでも行えます。</p></div><div class="links"><button class="linkbtn" data-legal="terms">利用規約</button><button class="linkbtn" data-legal="privacy">プライバシーポリシー</button></div>`);
}
openFromHash(); window.addEventListener("hashchange", openFromHash);
if(READY){
  sb.auth.getSession().then(({data})=>loadMe(data.session));
  sb.auth.onAuthStateChange((ev,session)=>{ if(ev==="SIGNED_IN"||ev==="SIGNED_OUT") setTimeout(()=>loadMe(session),0); });
}
</script>
