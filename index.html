<style>
:root{
  --bg:#E9EDEF; --card:#FFFFFF; --ink:#1B2329; --muted:#5B6870; --line:#D2DADE; --accent:#1E6C88; --on-accent:#FFFFFF;
  --ok:#2E8A52; --caution:#B88A0C; --warn:#D2621B; --danger:#BF3328; --like:#D9405E;
  --ok-soft:#DDF0E3; --caution-soft:#F6EDCF; --warn-soft:#FBE3D3; --danger-soft:#F8DCD9;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --nav-h:62px; color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#12181C; --card:#1B2328; --ink:#E6ECEF; --muted:#9AA8B0; --line:#2D3940; --accent:#5FB4D2; --on-accent:#0E1A20;
  --ok:#5BC384; --caution:#E2B83D; --warn:#F08B4B; --danger:#F06A5E; --like:#F27390;
  --ok-soft:#1C3527; --caution-soft:#3A3218; --warn-soft:#3E2718; --danger-soft:#42201D; color-scheme:dark } }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
a{color:var(--accent)}
.view{max-width:560px;margin:0 auto;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-weight:900;font-size:1.5rem;margin:0}
h2{font-family:var(--display);font-size:1.05rem;font-weight:700;margin:0}
h3{font-family:var(--display);font-size:.98rem;font-weight:700;margin:6px 0 0}
.sub,.note{font-size:.82rem;color:var(--muted);margin:0}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
section{display:flex;flex-direction:column;gap:10px}
.panel{background:var(--card);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.btn{font-weight:700;border:0;border-radius:10px;padding:10px 16px;background:var(--accent);color:var(--on-accent);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.danger{background:var(--danger);color:#fff}
.btn.wide{width:100%}
.btn:disabled{opacity:.5}
.linkbtn{border:0;background:none;color:var(--accent);padding:4px 0;cursor:pointer;text-decoration:underline;font-size:.85rem}
input[type=text],input[type=email],textarea{width:100%;font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
textarea{resize:vertical;min-height:80px}
.row2{display:flex;gap:8px;flex-wrap:wrap}.row2>*{flex:1 1 140px;min-width:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.verdict{border-radius:18px;padding:20px;background:var(--lvsoft);border:2px solid var(--lv);display:flex;flex-direction:column;gap:10px}
.when{font-size:.85rem;font-weight:700;color:var(--muted)}
.big{font-family:var(--display);font-weight:900;font-size:2.3rem;line-height:1.15;color:var(--lv);margin:0}
.lead{margin:0;font-weight:500}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.metric{background:var(--card);border-radius:12px;padding:10px 10px 8px}
.metric b{display:block;font-family:var(--display);font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.metric span{font-size:.74rem;color:var(--muted)}
.walk{flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap}
.walk b{font-family:var(--display);font-size:1.8rem;font-variant-numeric:tabular-nums;margin-right:8px}
.strip{display:flex;gap:3px;overflow-x:auto;padding-bottom:4px}
.cell{flex:1 0 18px;min-width:18px;height:46px;border:0;border-radius:5px;background:var(--c);cursor:pointer;padding:0}
.cell[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:1px}
.hours{display:flex;gap:3px;font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}
.hours span{flex:1 0 18px;min-width:18px;text-align:center}
.best{background:var(--card);border-radius:12px;padding:12px 14px;font-weight:700}
.best small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.surfrow{display:grid;grid-template-columns:88px 1fr 52px;align-items:center;gap:10px}
.surfrow .v{text-align:right;font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.track{position:relative;height:12px;background:var(--bg);border-radius:6px;overflow:hidden}
.fill{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--c)}
.mark{position:absolute;top:0;bottom:0;width:2px;background:var(--danger)}
.reasons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.reasons li{background:var(--card);border-radius:12px;padding:10px 14px 10px 32px;position:relative}
.reasons li::before{content:"";position:absolute;left:13px;top:17px;width:9px;height:9px;border-radius:50%;background:var(--c)}
#homeBody{display:flex;flex-direction:column;gap:18px}
.start{background:var(--card);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px}
.start p{margin:0}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.grp{display:flex;flex-direction:column;gap:6px}.grp>span{font-size:.8rem;color:var(--muted)}
.chip{font-size:.88rem;border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:5px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}

#tab-map{max-width:none;padding:0;gap:0}
#map{position:fixed;inset:0 0 calc(var(--nav-h) + env(safe-area-inset-bottom,0px)) 0;z-index:0;background:var(--bg)}
.mapbar{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));z-index:500;display:flex;gap:8px;justify-content:space-between;pointer-events:none}
.mapbar>*{pointer-events:auto}
.pill{background:var(--card);border-radius:99px;padding:8px 14px;font-size:.85rem;font-weight:700;box-shadow:0 2px 10px rgba(0,0,0,.18);border:0;cursor:pointer}
.pill .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:-1px}
.pin{width:52px;height:52px;border-radius:14px;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35);background:#ccc center/cover no-repeat;position:relative}
.pin b{position:absolute;right:-8px;top:-8px;background:var(--accent);color:var(--on-accent);font-size:.72rem;min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}
.me-dot{width:18px;height:18px;border-radius:50%;background:#2B7BE4;border:3px solid #fff;box-shadow:0 0 0 6px rgba(43,123,228,.25)}

.seg{display:flex;background:var(--card);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 0;font-weight:700;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.feed{display:flex;flex-direction:column;gap:16px}
.post{background:var(--card);border-radius:16px;overflow:hidden}
.phead{display:flex;align-items:center;gap:10px;padding:10px 12px}
.av{width:38px;height:38px;border-radius:50%;background:var(--line) center/cover no-repeat;flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:var(--muted)}
.who{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0;cursor:pointer}
.who b{display:block;line-height:1.3}
.who span{font-size:.76rem;color:var(--muted)}
.new{display:inline-block;font-size:.66rem;font-weight:700;letter-spacing:.06em;background:var(--accent);color:var(--on-accent);border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:2px}
.more{border:0;background:none;font-size:1.3rem;line-height:1;padding:4px 8px;cursor:pointer;color:var(--muted)}
.pimg{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--line);max-width:100%}
.pbody{padding:10px 12px 14px;display:flex;flex-direction:column;gap:6px}
.acts{display:flex;gap:14px;align-items:center}
.act{border:0;background:none;display:flex;align-items:center;gap:5px;font-weight:700;padding:4px 0;cursor:pointer;font-variant-numeric:tabular-nums}
.act svg{width:24px;height:24px}
.act.liked{color:var(--like)}
.cap{margin:0;white-space:pre-wrap;word-break:break-word}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.grid3 button{border:0;padding:0;aspect-ratio:1/1;background:var(--line) center/cover no-repeat;border-radius:6px;cursor:pointer}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom,0px));z-index:600;width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);box-shadow:0 4px 14px rgba(0,0,0,.28);cursor:pointer;display:grid;place-items:center}
.fab svg{width:28px;height:28px}

.prof{display:flex;gap:14px;align-items:center}
.prof .av{width:72px;height:72px;font-size:1.6rem}
.stats{display:flex;gap:18px;font-size:.85rem;color:var(--muted);flex-wrap:wrap}
.stats b{color:var(--ink);font-family:var(--display);font-size:1.1rem;margin-right:3px}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
.list{display:flex;flex-direction:column}
.list>div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.list>div:last-child{border-bottom:0}
.legal{font-size:.88rem;line-height:1.75}
.legal p,.legal ul{margin:4px 0}
.legal ul{padding-left:1.2em}
.links{display:flex;gap:16px;flex-wrap:wrap}

nav{position:fixed;left:0;right:0;bottom:0;z-index:700;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav button{flex:1;height:var(--nav-h);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.7rem;color:var(--muted);cursor:pointer}
nav button svg{width:24px;height:24px}
nav button[aria-current="page"]{color:var(--accent);font-weight:700}

.scrim{position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheethead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{border:0;background:var(--card);width:36px;height:36px;border-radius:50%;font-size:1.2rem;cursor:pointer;flex:none}
.cmts{display:flex;flex-direction:column;gap:10px}
.cmt{display:flex;gap:10px}.cmt .av{width:30px;height:30px;font-size:.8rem}
.cmt div{min-width:0}.cmt p{margin:0;word-break:break-word}.cmt small{color:var(--muted)}
.menu{display:flex;flex-direction:column;gap:8px}
.menu button{border:0;background:var(--card);border-radius:12px;padding:14px;text-align:left;font-weight:700;cursor:pointer}
.menu .danger{color:var(--danger)}
.preview{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:14px;background:var(--line)}
.shareimg{width:100%;border-radius:14px}
.pick{border:2px dashed var(--line);border-radius:14px;aspect-ratio:1/1;display:grid;place-items:center;color:var(--muted);cursor:pointer;background:var(--card);text-align:center;padding:20px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 90px + env(safe-area-inset-bottom,0px));z-index:1000;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:.88rem;font-weight:700;max-width:90vw;text-align:center}
.leaflet-container{font-family:var(--body)}
</style>
</head>
<body>

<main class="view" id="tab-home">

    <div class="panel">

</main>

</main>

  <button data-tab="feed"><svg viewBox="0 0 24 24" fill="currentColor"><ellipse cx="7" cy="9" rx="2" ry="2.6"/><ellipse cx="17" cy="9" rx="2" ry="2.6"/><ellipse cx="10.3" cy="5.2" rx="1.9" ry="2.5"/><ellipse cx="13.7" cy="5.2" rx="1.9" ry="2.5"/><path d="M12 11.5c-3 0-6 3.6-6 6.2 0 1.6 1.4 2.3 3 2.3 1.2 0 2-.6 3-.6s1.8.6 3 .6c1.6 0 3-.7 3-2.3 0-2.6-3-6.2-6-6.2z"/></svg>みんな</button>

<script>
/* ================= 設定 ================= */
const CONFIG = {
  supabaseUrl: "https://odwucmmcxbdyhncxdwvg.supabase.co",
  supabaseKey: "sb_publishable_QHjteDmQ0H_2gfAv5wDAgg_LVEzWQS9",
  appUrl: "https://sanpolab.github.io/sanpo/",
  contact: "nakanakadoukana@gmail.com",      // お問い合わせ先（メールアドレスなど）
  operator: "さんぽ路面計 運営者",
  updated: "2026年11月1日"
};
/* ======================================= */

const READY = !!window.supabase;
const sb = READY ? supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey) : null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const photo = p => p ? `${CONFIG.supabaseUrl}/storage/v1/object/public/photos/${p}` : "";
const ls = { get(k,d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
             set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
             del(k){ try{ localStorage.removeItem(k); }catch(e){} } };
function toast(t){ const d=document.createElement("div"); d.className="toast"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2800); }
const ago = t => { const s=(Date.now()-new Date(t))/1000; if(s<60)return"たった今"; if(s<3600)return Math.floor(s/60)+"分前"; if(s<86400)return Math.floor(s/3600)+"時間前"; if(s<604800)return Math.floor(s/86400)+"日前"; const d=new Date(t); return `${d.getMonth()+1}月${d.getDate()}日`; };
const avatar = (p, name) => p ? `<span class="av" style="background-image:url('${photo(p)}')"></span>` : `<span class="av">${esc((name||"?").slice(0,1))}</span>`;
const petWord = t => t==="cat" ? "ねこ" : "わんこ";

let me = null, pos = null, weather = null, rawWeather = null;
let pet = Object.assign({species:"dog", size:"small", age:"adult", brachy:"no"}, ls.get("sanpo-profile", {}));
let walkStart = ls.get("sanpo-walk", null);

/* ================= 判定 ================= */
const LV = [
  {name:"散歩OK", c:"var(--ok)", s:"var(--ok-soft)", hex:"#2E8A52"},
  {name:"注意して散歩", c:"var(--caution)", s:"var(--caution-soft)", hex:"#B88A0C"},
  {name:"短めに切り上げて", c:"var(--warn)", s:"var(--warn-soft)", hex:"#D2621B"},
  {name:"今は避けて", c:"var(--danger)", s:"var(--danger-soft)", hex:"#BF3328"}
];
const CODE = c => c===0?"快晴":c<=2?"晴れ":c===3?"くもり":c<=48?"霧":c<=67?"雨":c<=77?"雪":c<=82?"にわか雨":c<=86?"にわか雪":"雷雨";
const wbgt = (t,rh,sw,ws) => 0.735*t + 0.0374*rh + 0.00292*t*rh + 7.619*sw - 4.557*sw*sw - 0.0572*ws - 4.064;
function windChill(t, ws){ const v=ws*3.6; if(t>10||v<=4.8) return t; const p=Math.pow(v,0.16); return 13.12+0.6215*t-11.37*p+0.3965*t*p; }
function evaluate(all){
  const cat = pet.species==="cat", size = cat ? "small" : pet.size;
  const heatOff = (pet.brachy==="yes"?2:0) + (pet.age!=="adult"?1:0) + (size==="small"?0.5:0);
  const coldOff = (size==="small"?3:size==="large"?-3:0) + (pet.age!=="adult"?2:0);
  let prevD = 0;
  return all.map((h,i)=>{
    const sw = j => all[Math.max(0,i-j)].sw;
    const lag = 0.6*sw(0)+0.25*sw(1)+0.15*sw(2);
    let d = Math.max(0.5, 0.026*lag - 0.6*Math.max(0,h.ws-1)); d = Math.max(d, prevD*0.55); prevD = d;
    const asph=h.temp+d, conc=h.temp+0.65*d, grass=h.temp+0.2*d;
    const w = wbgt(h.temp,h.rh,h.sw/1000,h.ws), wc = windChill(h.temp,h.ws);
    let p6=0, s48=0;
    for(let j=Math.max(0,i-6);j<=i;j++) p6+=all[j].precip||0;
    for(let j=Math.max(0,i-48);j<=i;j++) s48+=all[j].snow||0;
    const R=[], who = cat ? "猫" : "犬";
    if(asph>=50) R.push([3,`アスファルトが約${Math.round(asph)}℃。肉球が数十秒でやけどする温度です。`]);
    else if(asph>=45) R.push([2,`アスファルトが約${Math.round(asph)}℃。日なたの舗装路は避けて、土や芝生の上を歩きましょう。`]);
    else if(asph>=40) R.push([1,`アスファルトが約${Math.round(asph)}℃で熱め。出る前に手で触って確かめましょう。`]);
    const t1=23-heatOff,t2=26-heatOff,t3=28.5-heatOff;
    if(w>=t3) R.push([3,`暑さ指数が${w.toFixed(1)}。${who}にとって熱中症の危険が高い状態です。`]);
    else if(w>=t2) R.push([2,`暑さ指数が${w.toFixed(1)}。散歩は短く、日陰と水分補給を。`]);
    else if(w>=t1) R.push([1,`暑さ指数が${w.toFixed(1)}。地面に近い${who}は人より暑く感じています。`]);
    const c1=3+coldOff,c2=-4+coldOff,c3=-12+coldOff;
    if(wc<=c3) R.push([3,`体感温度が${Math.round(wc)}℃。体が冷えすぎる危険があります。`]);
    else if(wc<=c2) R.push([2,`体感温度が${Math.round(wc)}℃。服を着せて短めに。`]);
    else if(wc<=c1) R.push([1,`体感温度が${Math.round(wc)}℃。寒がりの子は服があると安心です。`]);
    if(h.temp<=1 && (p6>0.2||s48>0)) R.push([2,`気温${h.temp.toFixed(1)}℃で路面が凍っている可能性があります。日陰や橋の上に注意。`]);
    else if(h.temp<=-1 && h.rh>=90 && h.sw<50) R.push([1,"冷え込みで路面に霜や薄い氷ができやすい時間です。"]);
    if(s48>0 && h.temp<=6) R.push([1,"雪のあとは融雪剤がまかれていることがあります。帰ったら足をぬるま湯で洗いましょう。"]);
    if(h.precip>=10) R.push([2,`強い雨（${h.precip}mm）が予想されています。`]);
    else if(h.precip>=2) R.push([1,`雨が降っています（${h.precip}mm）。`]);
    const level = R.reduce((m,r)=>Math.max(m,r[0]),0);
    if(!R.length) R.push([0,"暑さ、寒さ、路面ともに問題ありません。"]);
    if(h.hour<5||h.hour>=19) R.push([0,"暗い時間帯です。光るリードや反射材があると安全です。"]);
    if(cat) R.push([0,"猫は抜けにくいハーネスを使い、驚いたときにすぐ抱き上げられるようにしましょう。"]);
    R.sort((a,b)=>b[0]-a[0]);
    return {level,asph,conc,grass,w,wc,reasons:R};
  });
}
async function loadWeather(lat, lon, place){
  try{
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(3)}&longitude=${lon.toFixed(3)}&hourly=temperature_2m,relative_humidity_2m,shortwave_radiation,wind_speed_10m,precipitation,snowfall,weather_code&wind_speed_unit=ms&timezone=auto&past_days=2&forecast_days=2`);
    if(!r.ok) throw 0;
    const j = await r.json(), H = j.hourly;
    const all = H.time.map((t,i)=>({t,hour:+t.slice(11,13),temp:H.temperature_2m[i],rh:H.relative_humidity_2m[i],sw:H.shortwave_radiation[i]||0,ws:H.wind_speed_10m[i]||0,precip:H.precipitation[i]||0,snow:H.snowfall[i]||0,code:H.weather_code[i]}));
    const key = new Date(Date.now()+j.utc_offset_seconds*1000).toISOString().slice(0,13);
    let idx = all.findIndex(x=>x.t.slice(0,13)===key); if(idx<0) idx = Math.min(48, all.length-24);
    rawWeather = {all, idx, place}; weather = null;
    computeWeather();
  }catch(e){ $("#homeBody").innerHTML = startCard("天気を取得できませんでした。電波の良い場所でもう一度お試しください。"); bindStart(); }
}
function computeWeather(){
  if(!rawWeather) return;
  const {all, idx, place} = rawWeather, ev = evaluate(all);
  const sel = weather ? weather.sel : 0;
  weather = {place, sel, hours: all.slice(idx, idx+24).map((h,k)=>Object.assign({},h,ev[idx+k],{isNow:k===0}))};
  renderHome(); updateMapStatus();
}
function startCard(msg){
  return `<div class="start"><h2>今、散歩して大丈夫？</h2><p>現在地の天気から、路面の温度と暑さ・寒さを判定します。位置情報はこの端末の中で使い、正確な位置はどこにも保存しません。</p>${msg?`<p class="note">${esc(msg)}</p>`:""}<button class="btn" id="geoBtn">現在地で判定する</button></div>`;
}
function bindStart(){ const b=$("#geoBtn"); if(b) b.onclick=()=>locate(true); }
function bestWindows(H){
  const runs=[]; let st=-1;
  H.forEach((x,i)=>{ const g=x.level===0&&x.hour>=5&&x.hour<21; if(g&&st<0)st=i; if((!g||i===H.length-1)&&st>=0){ runs.push([st,g?i:i-1]); st=-1; } });
  return runs.sort((a,b)=>(b[1]-b[0])-(a[1]-a[0])).slice(0,2).sort((a,b)=>a[0]-b[0]).map(([a,b])=>`${H[a].hour}時〜${(H[b].hour+1)%24}時`);
}
function walkCard(){
  if(walkStart) return `<div class="panel walk"><div><b id="walkClock">0:00</b><span class="note">散歩中</span></div><div class="row2" style="flex:0 1 240px"><button class="btn" id="walkEnd">おわった</button><button class="btn ghost" id="walkCancel">取り消す</button></div></div>`;
  return `<div class="row2"><button class="btn" id="walkBtn">散歩をはじめる</button><button class="btn ghost" id="shareBtn">判定をシェア</button></div>`;
}
function renderHome(){
  if(!weather){ $("#homeBody").innerHTML = startCard(); bindStart(); renderPetChips(); return; }
  const H = weather.hours, h = H[weather.sel], L = LV[h.level];
  $("#placeLbl").textContent = `${weather.place}・${CODE(h.code)}`;
  const cold = h.temp < 12;
  const pct=t=>Math.max(2,Math.min(100,(t+10)/80*100));
  const col=t=>t>=50?"var(--danger)":t>=45?"var(--warn)":t>=40?"var(--caution)":t<=0?"var(--accent)":"var(--ok)";
  const wins = bestWindows(H);
  $("#homeBody").innerHTML = `
  <div class="verdict" style="--lv:${L.c};--lvsoft:${L.s}">
    <div class="when">${h.isNow?"今":h.hour+"時の予報"}</div>
    <p class="big">${L.name}</p>
    <p class="lead">${esc(h.reasons[0][1])}</p>
    <div class="metrics">
      <div class="metric"><b>${Math.round(h.asph)}℃</b><span>アスファルト推定</span></div>
      <div class="metric"><b>${cold?Math.round(h.wc)+"℃":h.w.toFixed(1)}</b><span>${cold?"体感温度":"暑さ指数"}</span></div>
      <div class="metric"><b>${h.temp.toFixed(1)}℃</b><span>気温</span></div>
    </div>
  </div>
  <div id="walkArea">${walkCard()}</div>
  <section><h2>これから24時間</h2>
    <div><div class="strip">${H.map((x,i)=>`<button class="cell" data-i="${i}" style="--c:${LV[x.level].c}" aria-pressed="${i===weather.sel}" aria-label="${x.hour}時 ${LV[x.level].name}"></button>`).join("")}</div>
    <div class="hours">${H.map((x,i)=>`<span>${i===0?"今":x.hour%3===0?x.hour:""}</span>`).join("")}</div></div>
    <div class="legend"><span><i style="background:var(--ok)"></i>散歩OK</span><span><i style="background:var(--caution)"></i>注意</span><span><i style="background:var(--warn)"></i>短めに</span><span><i style="background:var(--danger)"></i>避けて</span></div>
    <div class="best">${wins.length?`おすすめの時間：${wins.join("、")}<small>暑さ・寒さ・路面の条件がそろって安全な時間帯です。</small>`:`安全な時間帯がありません<small>色が薄い時間を選んで短めに。室内遊びに切り替えるのもおすすめです。</small>`}</div>
  </section>
  <section><h2>路面の推定温度</h2><div class="panel">
    ${[["アスファルト",h.asph],["コンクリート",h.conc],["土・芝生",h.grass]].map(([n,t])=>`<div class="surfrow"><span>${n}</span><div class="track"><div class="fill" style="width:${pct(t)}%;--c:${col(t)}"></div><div class="mark" style="left:${pct(50)}%"></div></div><span class="v">${Math.round(t)}℃</span></div>`).join("")}
    <p class="note">赤い線は50℃（肉球がやけどする目安）</p>
  </div></section>
  <section><h2>判定の理由</h2><ul class="reasons">${h.reasons.map(r=>`<li style="--c:${LV[r[0]].c}">${esc(r[1])}</li>`).join("")}</ul></section>`;
  document.querySelectorAll(".cell").forEach(b=>b.onclick=()=>{ weather.sel=+b.dataset.i; renderHome(); });
  bindWalk(); renderPetChips();
}
function renderPetChips(){
  const g=(key,label,opts)=>`<div class="grp"><span>${label}</span><div class="chips">${opts.map(([v,t])=>`<button class="chip" data-k="${key}" data-v="${v}" aria-pressed="${pet[key]===v}">${t}</button>`).join("")}</div></div>`;
  const cat = pet.species==="cat";
  $("#petChips").innerHTML = g("species","種類",[["dog","犬"],["cat","猫"]])
    + (cat ? "" : g("size","体の大きさ",[["small","小型犬"],["medium","中型犬"],["large","大型犬"]]))
    + g("age","年齢",cat?[["puppy","子猫"],["adult","成猫"],["senior","シニア"]]:[["puppy","子犬"],["adult","成犬"],["senior","シニア"]])
    + g("brachy",cat?"鼻の短い猫種（ペルシャ、エキゾチックなど）":"鼻の短い犬種（パグ、フレブル、シーズーなど）",[["no","ちがう"],["yes","そう"]]);
  $("#petChips").querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
    pet[c.dataset.k]=c.dataset.v; ls.set("sanpo-profile",pet); computeWeather(); renderPetChips(); savePetToProfile();
  });
}
async function savePetToProfile(){
  if(!me) return;
  const upd = {pet_type:pet.species, dog_size:pet.size, dog_age:pet.age, brachy:pet.brachy==="yes"};
  await sb.from("profiles").update(upd).eq("id",me.id); Object.assign(me.profile, upd);
}

/* ================= 散歩の記録 ================= */
function bindWalk(){
  const b=$("#walkBtn"); if(b) b.onclick=()=>{ walkStart=Date.now(); ls.set("sanpo-walk",walkStart); $("#walkArea").innerHTML=walkCard(); bindWalk(); tick(); };
  const s=$("#shareBtn"); if(s) s.onclick=shareVerdict;
  const c=$("#walkCancel"); if(c) c.onclick=()=>{ walkStart=null; ls.del("sanpo-walk"); $("#walkArea").innerHTML=walkCard(); bindWalk(); };
  const e=$("#walkEnd"); if(e) e.onclick=finishWalk;
}
function tick(){ const el=$("#walkClock"); if(el&&walkStart){ const s=Math.floor((Date.now()-walkStart)/1000); el.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; } }
setInterval(tick,1000);
async function finishWalk(){
  const minutes = Math.min(600, Math.max(1, Math.round((Date.now()-walkStart)/60000)));
  const h = weather ? weather.hours[0] : null;
  const row = {started_at:new Date(walkStart).toISOString(), minutes, level:h?h.level:null, asph:h?Math.round(h.asph):null};
  walkStart=null; ls.del("sanpo-walk"); $("#walkArea").innerHTML=walkCard(); bindWalk();
  if(!me){ toast(`${minutes}分の散歩でした。ログインすると記録が残ります`); return; }
  const {error} = await sb.from("walks").insert(row);
  toast(error ? "記録できませんでした" : `${minutes}分の散歩を記録しました`);
}
async function walkStats(){
  const since = new Date(Date.now()-60*86400e3).toISOString();
  const {data} = await sb.from("walks").select("started_at,minutes").order("started_at",{ascending:false}).gte("started_at",since).limit(300);
  const list = data||[];
  const day = d => { const x=new Date(d); return `${x.getFullYear()}-${x.getMonth()}-${x.getDate()}`; };
  const days = new Set(list.map(w=>day(w.started_at)));
  let streak=0; const c=new Date(); if(!days.has(day(c))) c.setDate(c.getDate()-1);
  while(days.has(day(c))){ streak++; c.setDate(c.getDate()-1); }
  const mStart = new Date(); mStart.setDate(1); mStart.setHours(0,0,0,0);
  const month = list.filter(w=>new Date(w.started_at)>=mStart);
  return {list, streak, monthCount:month.length, monthMin:month.reduce((s,w)=>s+w.minutes,0)};
}

/* ================= シェア画像 ================= */
async function shareVerdict(){
  if(!weather) return;
  const h = weather.hours[0], L = LV[h.level], wins = bestWindows(weather.hours);
  try{ await document.fonts.ready; }catch(e){}
  const c=document.createElement("canvas"); c.width=1080; c.height=1350; const x=c.getContext("2d");
  x.fillStyle="#F3F6F7"; x.fillRect(0,0,1080,1350);
  x.fillStyle=L.hex; x.fillRect(0,0,1080,640);
  x.fillStyle="#fff"; x.font='700 46px "Zen Maru Gothic", sans-serif'; x.fillText(`今日の${pet.species==="cat"?"ねこ":"いぬ"}さんぽ判定`,80,130);
  x.font='900 128px "Zen Maru Gothic", sans-serif';
  const words = L.name.length>6 ? [L.name.slice(0,4), L.name.slice(4)] : [L.name];
  words.forEach((w,i)=>x.fillText(w,80,300+i*150));
  x.fillStyle="#1B2329"; x.font='700 44px "Zen Kaku Gothic New", sans-serif';

function getPosition(){
  return new Promise((res,rej)=>{
    if(!navigator.geolocation) return rej(new Error("unsupported"));
    navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lon:p.coords.longitude}), rej, {timeout:12000,maximumAge:300000,enableHighAccuracy:false});
  });
}
async function locate(fromUser){

}

const POST_COLS = "id,user_id,image_path,caption,area_name,lat_grid,lon_grid,created_at,profiles(nickname,dog_name,dog_breed,avatar_path,pet_type),likes(count),comments(count)";

async function fetchPosts(filter, limit=30){
  if(!READY) return [];
  let q = sb.from("posts").select(POST_COLS).order("created_at",{ascending:false}).limit(limit);
  q = filter ? filter(q) : q;
  const {data,error} = await q;
  if(error){ toast("投稿を読み込めませんでした"); return []; }
  const posts = data||[];
  posts.forEach(p=>{ p.likeCount=p.likes?.[0]?.count||0; p.cmtCount=p.comments?.[0]?.count||0; postCache[p.id]=p; });
  if(me && posts.length){

async function shrink(file, max=1280){
  let src;
  try{ src = await createImageBitmap(file,{imageOrientation:"from-image"}); }
  catch(e){ src = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); }); }
  const s = Math.min(1, max/Math.max(src.width,src.height));
  const c = document.createElement("canvas"); c.width=Math.round(src.width*s); c.height=Math.round(src.height*s);
  c.getContext("2d").drawImage(src,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(r,"image/jpeg",0.85)); // 描き直すので撮影場所などの情報は消える
}
async function areaName(lat, lon, zoom){
  try{
    const j = await (await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=${zoom}&accept-language=ja`)).json();
    const a = j.address||{}, city = a.city||a.town||a.village||a.county||"", sub = zoom>=14 ? (a.city_district||a.suburb||a.quarter||"") : "";
    return ((city + (sub && !city.includes(sub) ? sub : "")) || a.state || "").slice(0,60);
  }catch(e){ return ""; }
}
// 近くで投稿している人が少ないときは、もっと広いエリアにぼかす
async function safeArea(lat, lon){
  const fine = v => Math.round(v*100)/100, wide = v => Math.round(v*20)/20;
  const la=fine(lat), lo=fine(lon);
  const {data} = await sb.from("posts").select("user_id").eq("lat_grid",la).eq("lon_grid",lo)
    .gte("created_at",new Date(Date.now()-60*86400e3).toISOString()).limit(200);
  const others = new Set((data||[]).map(r=>r.user_id).filter(u=>u!==me.id)).size;
  if(others >= 2) return {lat_grid:la, lon_grid:lo, area_name: await areaName(la,lo,14), wide:false};
  const wa=wide(lat), wo=wide(lon);
  return {lat_grid:wa, lon_grid:wo, area_name: await areaName(wa,wo,10), wide:true};
}

  if(!me) return needLogin();
  let blob=null, area=null;
  const sh = openSheet(`<div class="sheethead"><h2>うちの子を投稿</h2><button class="x" data-close>×</button></div>
    <label class="pick" id="pick"><span>タップして写真を選ぶ</span><input type="file" id="fileIn" accept="image/*" hidden></label>
    <textarea id="capIn" maxlength="300" placeholder="ひとこと（例：今日は涼しくて元気いっぱい！）"></textarea>
    <label class="check"><input type="checkbox" id="areaChk" checked><span>だいたいのエリアを付ける<br><small class="note" id="areaLbl">地域名だけが表示され、正確な場所は保存されません。地図には投稿の1時間後に表示されます。</small></span></label>
    <p class="note">家や表札、人の顔、車のナンバーが写っていないか確認してください。写真の撮影場所の情報は自動で消してから送ります。投稿すると<button class="linkbtn" data-legal="terms">利用規約</button>に同意したものとみなします。</p>
    <button class="btn wide" id="postBtn" disabled>投稿する</button>`);
  sh.querySelector("#fileIn").onchange = async e=>{
    const f=e.target.files[0]; if(!f) return;
    try{ blob = await shrink(f); }catch(err){ return toast("この写真は読み込めませんでした"); }
    const pk=sh.querySelector("#pick"); pk.innerHTML = `<img class="preview" src="${URL.createObjectURL(blob)}" alt="選んだ写真">`; pk.style.padding="0"; pk.style.border="0";
    sh.querySelector("#postBtn").disabled=false;
  };
  const fillArea = async()=>{
    const lbl=sh.querySelector("#areaLbl");
    if(!sh.querySelector("#areaChk").checked){ area=null; lbl.textContent="エリアなしで投稿します（地図には表示されません）。"; return; }
    lbl.textContent="エリアを確認しています…";
    try{ if(!pos) pos = await getPosition(); }catch(e){ area=null; lbl.textContent="位置情報を使えないため、エリアなしで投稿します。"; return; }
    area = await safeArea(pos.lat, pos.lon);
    lbl.textContent = `表示：「${area.area_name||"このあたり"}あたり」${area.wide?"（近くの投稿が少ないので広めに表示します）":""}。正確な場所は保存されず、地図には1時間後に表示されます。`;
  };
  sh.querySelector("#areaChk").onchange = fillArea; fillArea();
  sh.querySelector("#postBtn").onclick = async()=>{
    const btn=sh.querySelector("#postBtn"); btn.disabled=true; btn.textContent="投稿しています…";
    const path = `${me.id}/${Date.now()}.jpg`;
    const up = await sb.storage.from("photos").upload(path, blob, {contentType:"image/jpeg"});
    if(up.error){ btn.disabled=false; btn.textContent="投稿する"; return toast("写真を送れませんでした"); }
    const row = {image_path:path, caption:sh.querySelector("#capIn").value.trim()};
    if(area){ row.lat_grid=area.lat_grid; row.lon_grid=area.lon_grid; row.area_name=area.area_name; }
    const {error} = await sb.from("posts").insert(row);
    if(error){ await sb.storage.from("photos").remove([path]); btn.disabled=false; btn.textContent="投稿する"; return toast("投稿できませんでした"); }
    closeSheet(); toast("投稿しました"); feedMode="new";
    $("#feedSeg").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.f==="new"));
    go("feed");
  };
}
$("#fab").onclick = openComposer;

/* ================= ログインとマイページ ================= */
async function loadMe(session){
  if(!session){ me=null; renderMe(); return; }
  let {data:pr} = await sb.from("profiles").select("*").eq("id",session.user.id).maybeSingle();
  if(!pr){ await sb.from("profiles").insert({id:session.user.id}); ({data:pr} = await sb.from("profiles").select("*").eq("id",session.user.id).maybeSingle()); }
  pr = pr || {id:session.user.id,nickname:"飼い主さん",dog_name:"",dog_breed:""};
  me = {id:session.user.id, email:session.user.email, profile:pr};
  if(pr.pet_type) pet = {species:pr.pet_type, size:pr.dog_size||"small", age:pr.dog_age||"adult", brachy:pr.brachy?"yes":"no"};
  ls.set("sanpo-profile",pet); computeWeather(); renderPetChips(); renderMe();
}
async function renderMe(){
  const el=$("#meBody");
  if(!READY){ el.innerHTML=`<div class="panel"><p class="note">投稿とログインの準備ができていません。電波の良い場所で開き直してください。</p></div>`; return; }
  if(!me){
    el.innerHTML=`<div class="panel"><h2>ログイン・新規登録</h2><p class="note">メールアドレスにログイン用のリンクを送ります。パスワードは不要です。</p>
      <input type="email" id="emailIn" placeholder="メールアドレス" autocomplete="email"><button class="btn wide" id="loginBtn">ログイン用のメールを送る</button><p class="note" id="loginMsg">登録すると<button class="linkbtn" data-legal="terms">利用規約</button>と<button class="linkbtn" data-legal="privacy">プライバシーポリシー</button>に同意したものとみなします。</p></div>`;
    $("#loginBtn").onclick = async()=>{
      const email=$("#emailIn").value.trim(); if(!/^\S+@\S+\.\S+$/.test(email)) return $("#loginMsg").textContent="メールアドレスを確認してください。";
      $("#loginBtn").disabled=true;
      const {error}=await sb.auth.signInWithOtp({email, options:{emailRedirectTo: CONFIG.appUrl}});
      $("#loginBtn").disabled=false;
      $("#loginMsg").textContent = error ? "送れませんでした。少し時間をおいてお試しください。" : `${email} にメールを送りました。メールのリンクを開くとログインできます。届かないときは迷惑メールのフォルダも確認してください。`;
    };
    return;
  }
  const pr=me.profile;
  el.innerHTML=`<div class="panel">
      <div class="prof"><label style="cursor:pointer">${avatar(pr.avatar_path,pr.dog_name||pr.nickname)}<input type="file" id="avIn" accept="image/*" hidden></label>
        <div><h2>${esc(pr.dog_name||"うちの子の名前を登録しよう")}</h2><p class="note">写真をタップすると変更できます</p></div></div>
      <label class="fld">うちの子の名前<input type="text" id="pDog" maxlength="30" value="${esc(pr.dog_name)}"></label>
      <label class="fld">種類（犬種・猫種）<input type="text" id="pBreed" maxlength="40" value="${esc(pr.dog_breed)}" placeholder="例：柴犬、スコティッシュフォールド、ミックス"></label>
      <label class="fld">飼い主のニックネーム<input type="text" id="pNick" maxlength="30" value="${esc(pr.nickname)}"></label>
      <button class="btn" id="saveP">保存する</button></div>
    <section><h2>散歩の記録</h2><div class="panel" id="walkPanel"><p class="note">読み込み中…</p></div></section>
    <div class="row2"><button class="btn ghost" id="myPage">自分の投稿を見る</button><button class="btn ghost" id="logout">ログアウト</button></div>
    <section><h2>ブロック中の人</h2><div class="panel" id="blockPanel"><p class="note">読み込み中…</p></div></section>
    <section><h2>アカウント</h2><div class="panel"><p class="note">ログイン中：${esc(me.email||"")}</p><button class="btn ghost" id="delAcc" style="color:var(--danger);border-color:var(--danger)">アカウントを削除する</button></div></section>
    ${CONFIG.contact.includes("_HERE")?"":`<p class="note">お問い合わせ：${esc(CONFIG.contact)}</p>`}`;
  $("#saveP").onclick = async()=>{
    const upd={dog_name:$("#pDog").value.trim(),dog_breed:$("#pBreed").value.trim(),nickname:$("#pNick").value.trim()||"飼い主さん"};
    const {error}=await sb.from("profiles").update(upd).eq("id",me.id);
    if(error) return toast("保存できませんでした"); Object.assign(me.profile,upd); renderMe(); toast("保存しました");
  };
  $("#avIn").onchange = async e=>{
    const f=e.target.files[0]; if(!f) return;
    const blob=await shrink(f,400), path=`${me.id}/avatar-${Date.now()}.jpg`;
    const up=await sb.storage.from("photos").upload(path,blob,{contentType:"image/jpeg"}); if(up.error) return toast("写真を送れませんでした");
    const old=me.profile.avatar_path;
    await sb.from("profiles").update({avatar_path:path}).eq("id",me.id); me.profile.avatar_path=path;
    if(old) sb.storage.from("photos").remove([old]);
    renderMe(); toast("変更しました");
  };
  $("#myPage").onclick = ()=>openUser(me.id);
  $("#logout").onclick = async()=>{ await sb.auth.signOut(); };
  $("#delAcc").onclick = confirmDelete;
  walkStats().then(s=>{
    const wp=$("#walkPanel"); if(!wp) return;
    wp.innerHTML = `<div class="stats"><span><b>${s.monthCount}</b>回（今月）</span><span><b>${s.monthMin}</b>分（今月）</span><span><b>${s.streak}</b>日連続</span></div>`
      + (s.list.length ? `<div class="list">${s.list.slice(0,7).map(w=>{ const d=new Date(w.started_at); return `<div><span>${d.getMonth()+1}月${d.getDate()}日 ${d.getHours()}:${String(d.getMinutes()).padStart(2,"0")}</span><b>${w.minutes}分</b></div>`; }).join("")}</div>` : `<p class="note">判定の画面の「散歩をはじめる」から記録できます。</p>`);
  });
  renderBlocks();
}
async function renderBlocks(){
  const bp=$("#blockPanel"); if(!bp) return;
  const {data} = await sb.from("blocks").select("blocked_id,profiles!blocks_blocked_id_fkey(nickname,dog_name)").eq("blocker_id",me.id);
  if(!data||!data.length){ bp.innerHTML=`<p class="note">ブロック中の人はいません。</p>`; return; }
  bp.innerHTML = `<div class="list">${data.map(b=>`<div><span>${esc(b.profiles?.dog_name||b.profiles?.nickname||"ユーザー")}</span><button class="btn ghost" data-unblock="${b.blocked_id}" style="flex:0 0 auto;padding:6px 12px">解除</button></div>`).join("")}</div>`;
  bp.querySelectorAll("[data-unblock]").forEach(b=>b.onclick=async()=>{ await sb.from("blocks").delete().eq("blocker_id",me.id).eq("blocked_id",b.dataset.unblock); toast("解除しました"); renderBlocks(); });
}
function confirmDelete(){
  const sh = openSheet(`<h2>アカウントを削除しますか？</h2><p>投稿した写真、コメント、いいね、フォロー、散歩の記録がすべて消え、元に戻せません。</p><label class="check"><input type="checkbox" id="delOk"><span>すべて消えることを理解しました</span></label><div class="menu"><button class="danger" id="delYes" disabled>アカウントを削除する</button><button data-close>やめる</button></div>`);
  const yes = sh.querySelector("#delYes");
  sh.querySelector("#delOk").onchange = e=>{ yes.disabled = !e.target.checked; };
  yes.onclick = async()=>{
    yes.disabled = true; yes.textContent = "削除しています…";
    try{
      const {data:files} = await sb.storage.from("photos").list(me.id,{limit:1000});
      if(files && files.length) await sb.storage.from("photos").remove(files.map(f=>`${me.id}/${f.name}`));
    }catch(e){}
    const {error} = await sb.rpc("delete_account");
    if(error){ yes.disabled=false; yes.textContent="アカウントを削除する"; return toast("削除できませんでした。時間をおいてお試しください"); }
    await sb.auth.signOut(); closeSheet(); me=null; renderMe(); toast("アカウントを削除しました");
  };
}

/* ================= 画面切り替え ================= */
function go(tab){
  ["home","map","feed","me"].forEach(t=>$("#tab-"+t).hidden = t!==tab);
  document.querySelectorAll("nav button").forEach(b=> b.dataset.tab===tab ? b.setAttribute("aria-current","page") : b.removeAttribute("aria-current"));
  $("#fab").hidden = !(READY && (tab==="feed"||tab==="map"));
  if(tab==="map") setTimeout(initMap,0);
  if(tab==="feed") loadFeed();
  if(tab==="me") renderMe();
  window.scrollTo(0,0);
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.tab));

/* ================= 起動 ================= */
renderHome(); renderMe();
if(ls.get("sanpo-geo-ok",false)) locate(false);
if(READY){
  sb.auth.getSession().then(({data})=>loadMe(data.session));
  sb.auth.onAuthStateChange((ev,session)=>{ if(ev==="SIGNED_IN"||ev==="SIGNED_OUT") setTimeout(()=>loadMe(session),0); });
}
</script>
